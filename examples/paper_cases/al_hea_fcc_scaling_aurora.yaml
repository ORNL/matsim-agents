# =============================================================================
# DFT-concurrency strong-scaling harness on ALCF Aurora (Intel Data Center GPU Max).
#
# Aurora analogue of al_hea_fcc_scaling.yaml. The AL loop dispatches up to
# (allocated nodes / nodes_per_job) VASP single-points concurrently, so
# submitting the same fixed 32-job workload at several node counts yields a
# strong-scaling curve for identical work.
#
# Aurora node layout: 12 GPU tiles per node (ZE_FLAT_DEVICE_HIERARCHY=FLAT)
#   -> ranks_per_node=12, threads_per_rank=1.
#
# Submit through:
#   deployments/aurora/jobs/job-al-dft-scaling-aurora.sh
#   deployments/aurora/jobs/submit-al-dft-scaling-sweep.sh
# =============================================================================
vars:
  PROJ_ROOT:    ${PROJ_ROOT:?export PROJ_ROOT to the Aurora matsim-agents checkout}
  RUNS_ROOT:    ${RUNS_ROOT:?export RUNS_ROOT}
  HYDRAGNN_DIR: ${HYDRAGNN_DIR:?export HYDRAGNN_DIR}
  # RUN_TAG is injected per-submission (encodes the node count) so each point in
  # the scaling sweep writes to its own directory and never resumes another.
  RUN_TAG:      ${SCALE_TAG:-hea-fcc-scaling-aurora-N1}

  # Built by deployments/aurora/setup/build-vasp-gpu-aurora.sh.
  VASP_BIN:   ${PROJ_ROOT}/external/vasp6/src/vasp.6.6.1/bin/vasp_std
  POTCAR_DIR: ${PROJ_ROOT}/external/vasp6/potcar/potpaw_PBE.64

  INITIAL_LOGDIR: ${RUNS_ROOT}/al-models/iter0_logdir

mlip:
  # HydraGNN runs from .venv; MLIP_BACKEND=uma or mace uses .venv-uma / .venv-mace.
  backend: ${MLIP_BACKEND:-hydragnn}
  hydragnn:
    logdir:         ${INITIAL_LOGDIR}
    checkpoint:     best_model.pt
    # The BEST6 multi-branch model REQUIRES its BranchWeightMLP; iter0_logdir has
    # no mlp_weights/ dir, so point at the trained MLP shipped with the example.
    mlp_checkpoint: ${HYDRAGNN_DIR}/examples/multidataset_hpo_sc26/mlp_branch_weights.pt
    precision:  fp32
    mlp_device: xpu
    ensemble_paths: []
  uma:
    model_name: uma-s-1p1
    task_name:  omat
    device:     xpu
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear

md:
  seed_source:
    kind: compositions
    compositions:
      - CrMnFeCoNi
      - Cr2MnFe2CoNi
      - CrMnFe2CoNi2
      - CrMnFeCoNi2
      - CrMn2FeCoNi
    max_phases_per_composition: 1    # 1 seed/composition -> 5 seeds (keeps MD cost low)
    # Equimolar HEAs have no matching AFLOW prototype (signature (1,1,1,1,1) is
    # absent from the 288-entry encyclopedia), so seeds come from one pyXtal
    # random structure per composition. AL_SEED is held fixed across node counts
    # within one repeat and varied per repeat by the sweep wrapper, so averaging
    # over repeats dampens per-draw variability in the reported throughput.
    n_random: 1
    random_seed: ${AL_SEED:-13}
  timestep_fs: 2.0
  n_steps: 150                       # 150 / sample_every(15) = 10 frames per seed
  temperature_K: 1000.0
  thermostat: langevin
  friction_inv_ps: 0.08
  sample_every: 15
  max_force_threshold_eV_per_A: 60.0
  max_displacement_A: 5.0
  # Seed the MD RNG (Maxwell-Boltzmann velocities + Langevin thermostat noise)
  # with the same AL_SEED as the seed structures above, so within one repeat the
  # candidate pool is drawn identically at every node count (N=1/2/4/8). Varying
  # AL_SEED across repeats yields independent random workloads whose per-N wall
  # times are averaged to give a robust strong-scaling estimate.
  random_seed: ${AL_SEED:-13}

acquisition:
  strategy: mc_dropout
  mc_dropout_passes: 8
  mc_dropout_p: 0.1
  n_select: 32                       # FIXED workload: exactly 32 VASP jobs/iter
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: ${DFT_BACKEND:-vasp}

  vasp:
    vasp_bin:         ${VASP_BIN}
    vasp_wrapper:     ${PROJ_ROOT}/deployments/aurora/launchers/_vasp-step-aurora.sh
    incar_template:   ${PROJ_ROOT}/examples/active_learning/INCAR.template
    kpoints_template: null
    potcar_dir:       ${POTCAR_DIR}
    timeout_sec: 10800
    extra_incar:
      ENCUT: "520"
      ISMEAR: "1"
      SIGMA: "0.20"
      ISPIN: "2"
      KSPACING: "0.22"
      NCORE: "4"

trainer:
  enabled: false                     # scaling test: isolate the DFT stage

loop:
  n_iterations: 1                    # single batch of 32 single-points
  out_dir: ${RUNS_ROOT}/${RUN_TAG}
  dataset_format: extxyz
  resume: false                      # every scaling point starts fresh
  fail_fast: false

# Placement (docs/resource-dispatch.md). AL stages run one after another, so
# DFT, training, and MLIP MD share devices; MD runs one seed per GPU of the
# first node.
resources:
  preset: aurora
  pools:
    dft:      {nodes: all, devices: all, threads_per_rank: 1, share_with: [training, mlip]}
    training: {nodes: 1, devices: 1, share_with: [dft, mlip]}
    mlip:     {nodes: 1, devices: all, share_with: [dft, training]}
