# =============================================================================
# Portability case: NbTaVHfZrTi BCC refractory HEA AL loop on OLCF Frontier.
#
# Cross-platform analogue of al_hea_bcc.yaml: the SAME active-learning loop
# (HydraGNN MD sampling + mc_dropout acquisition + VASP vasp_std labelling),
# retargeted from Perlmutter (NVIDIA A100) to Frontier (AMD MI250X). Only the
# vars/paths, the DFT + train launchers, and the per-node rank layout differ;
# the md, acquisition, and loop physics are identical to the Perlmutter config.
#
# Scientific motivation (from Zekun Chen, 2026-06-10):
#   Refractory BCC HEAs with >=6 principal elements present a combinatorial
#   challenge: AFLOW prototypes only cover equimolar bcc/fcc/hcp end-members.
#   Using mc_dropout uncertainty, the loop preferentially labels structures
#   with highest epistemic variance in predicted energy, efficiently mapping
#   the composition-structure-stability landscape.
#
# Frontier node layout: 8 GCDs per node, 56 usable cores (7 per GCD)
#   -> ranks_per_node=8, threads_per_rank=7.
#
# How to run (from the Frontier repo checkout):
#   matsim-agents al validate-config examples/paper_cases/al_hea_bcc_frontier.yaml
#   CASE=hea_bcc sbatch scripts/advanced/frontier/job-active-learning-paper-cases-frontier.sh
# =============================================================================

vars:
  PROJ_ROOT:    ${PROJ_ROOT:-/lustre/orion/lrn070/proj-shared/mlupopa/matstim-folder/matsim-agents}
  RUNS_ROOT:    ${RUNS_ROOT:-/lustre/orion/lrn070/proj-shared/mlupopa/matstim-folder/runs}
  HYDRAGNN_DIR: ${HYDRAGNN_DIR:-/lustre/orion/lrn070/proj-shared/mlupopa/matstim-folder/HydraGNN}
  RUN_TAG:      hea-bcc-frontier-al-001

  VASP_BIN:   ${PROJ_ROOT}/external/vasp6/src/vasp.6.6.0/bin/vasp_std
  POTCAR_DIR: ${PROJ_ROOT}/external/vasp6/potcar/potpaw_PBE.64

  INITIAL_LOGDIR: ${RUNS_ROOT}/al-models/iter0_logdir

mlip:
  # Frontier's venv is HydraGNN/ROCm; UMA (fairchem) is not installed there.
  backend: ${MLIP_BACKEND:-hydragnn}
  hydragnn:
    logdir:         ${INITIAL_LOGDIR}
    checkpoint:     best_model.pt
    mlp_checkpoint: null
    charge: 0.0
    spin:   0.0
    precision:  fp32
    mlp_device: cuda           # torch HIP maps the "cuda" device string on MI250X
    ensemble_paths: []       # optional; add sibling seed logdirs to switch to ensemble
  uma:
    model_name: uma-s-1p1
    task_name:  omat
    device:     cuda
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear

md:
  seed_source:
    kind: compositions
    compositions:
      # Equimolar sextet
      - NbTaVHfZrTi
      # 5-element sub-lattice variants (one element dropped)
      - NbTaVHfZr
      - NbTaVHfTi
      - NbTaVZrTi
      - NbTaHfZrTi
      - NbVHfZrTi
      - TaVHfZrTi
    max_phases_per_composition: 2    # BCC + FCC prototypes per formula
    n_random: 6                      # pyXtal random unit-cell seeds (BCC SG=229 preferred)
    random_seed: 7
  timestep_fs: 2.0
  n_steps: 500
  temperature_K: 1200.0             # refractory; sample disordered high-T regime
  thermostat: langevin
  friction_inv_ps: 0.05
  sample_every: 20
  max_force_threshold_eV_per_A: 80.0
  max_displacement_A: 6.0

acquisition:
  strategy: mc_dropout              # single-checkpoint uncertainty, no ensemble needed
  mc_dropout_passes: 16
  mc_dropout_p: 0.1
  n_select: 200
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: ${DFT_BACKEND:-vasp}

  vasp:
    vasp_bin:         ${VASP_BIN}
    vasp_wrapper:     ${PROJ_ROOT}/scripts/launchers/frontier/_vasp-step-frontier.sh
    incar_template:   ${PROJ_ROOT}/examples/active_learning/INCAR.template
    kpoints_template: null            # use KSPACING from INCAR (auto Gamma mesh)
    potcar_dir:       ${POTCAR_DIR}
    nodes_per_job: 1
    ranks_per_node: 8                 # 8 GCDs per Frontier node
    threads_per_rank: 7               # 56 usable cores / 8 GCDs
    timeout_sec: 10800
    extra_incar:
      ENCUT: "520"
      ISMEAR: "1"          # Methfessel-Paxton (order 1) for metallic BCC HEA
      SIGMA: "0.20"
      KSPACING: "0.25"
      NCORE: "4"

trainer:
  enabled: true
  train_script:   ${HYDRAGNN_DIR}/examples/mptrj/train.py
  train_launcher: ${PROJ_ROOT}/scripts/launchers/frontier/_hydragnn-train-step-frontier.sh
  epochs_per_iter: 5
  nodes_for_train: 4
  ranks_per_node:  8

loop:
  n_iterations: 12
  out_dir: ${RUNS_ROOT}/${RUN_TAG}
  dataset_format: extxyz
  resume: true
  fail_fast: false
