# =============================================================================
# Paper test case: Phosphorene — 2D elemental allotrope of phosphorus
#
# Scientific motivation (from Zekun Chen, 2026-06-10):
#   Phosphorene (single-layer black phosphorus) is a puckered 2D semiconductor
#   with a direct, thickness-tunable band gap and strong in-plane anisotropy.
#   The stability landscape to explore:
#     * black-P (puckered, Pmna) vs blue-P (buckled, P-3m1) allotropes
#     * in-plane strain response of the pucker angle
#     * edge / point-defect formation that drives degradation
#   Phosphorene is an MLIP stress test: a single light element, but with a
#   covalent puckered network whose energetics are sensitive to small
#   displacements — ideal for active learning of forces.
#
# Seed file (generated by singlepass.py, or supply your own):
#   examples/paper_cases/seeds/phosphorene_black_P.extxyz
#     python examples/paper_cases/singlepass.py --case phosphorene --seeds-only
#   For the paper, replace with the reference QE structure cited in the email
#   (materialssquare.com/work/43421).
#
# How to run:
#   matsim-agents al validate-config examples/paper_cases/al_phosphorene.yaml
# =============================================================================

vars:
  PROJ_ROOT:    /global/cfs/projectdirs/m5216/mlupopa/matsim-agents
  RUNS_ROOT:    /global/cfs/projectdirs/m5216/mlupopa/runs
  HYDRAGNN_DIR: /global/cfs/projectdirs/m5216/mlupopa/matsim-agents/HydraGNN
  RUN_TAG:      phosphorene-2d-al-001

  SEED_XYZ:   ${PROJ_ROOT}/examples/paper_cases/seeds/phosphorene_black_P.extxyz
  VASP_BIN:   ${PROJ_ROOT}/external/vasp6/src/vasp.6.6.0/bin/vasp_std
  POTCAR_DIR: /global/cfs/projectdirs/m5216/mlupopa/POTCAR/PBE.54

  INITIAL_LOGDIR: ${RUNS_ROOT}/al-models/iter0_logdir

mlip:
  # Surrogate selector — switch backend with one env var, no file edits:
  #   matsim-agents al run <cfg>                  # HydraGNN (default; retrains each iter)
  #   MLIP_BACKEND=uma matsim-agents al run <cfg>  # frozen UMA foundation model
  backend: ${MLIP_BACKEND:-hydragnn}
  hydragnn:
    logdir:         ${INITIAL_LOGDIR}
    checkpoint:     best_model.pt
    mlp_checkpoint: null
    precision:  fp32
    mlp_device: cuda
    ensemble_paths: []
  uma:
    model_name: uma-s-1p1     # fairchem pretrained model (or local checkpoint path)
    task_name:  omat          # elemental 2D material → inorganic bulk head
    device:     cuda
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear
  mace:
    # MACE-MP foundation model (mace-torch). Select with MLIP_BACKEND=mace;
    # size via MACE_MODEL (small|medium|large). Frozen by default (like UMA);
    # set MACE_RETRAIN=1 in the launcher to fine-tune each iteration.
    family:    ${MACE_FAMILY:-mace_mp}
    model:     ${MACE_MODEL:-medium}
    precision: fp64
    device:    cuda
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear

md:
  seed_source:
    # Supply the monolayer seed explicitly (2D allotropes are not in the
    # inorganic prototype enumerator). Fall back to 'compositions' [P] below.
    kind: paths
    paths:
      - ${SEED_XYZ}
    # ---- fallback if seed file absent ----
    # kind: compositions
    # compositions:
    #   - P
    # max_phases_per_composition: 3
    n_random: 3          # random strained / rumpled monolayer cells
    random_seed: 17
  timestep_fs: 0.5       # light element + soft pucker mode: short step
  n_steps: 200
  temperature_K: 300.0
  thermostat: langevin
  friction_inv_ps: 0.2
  sample_every: 10
  max_force_threshold_eV_per_A: 40.0
  max_displacement_A: 3.0

acquisition:
  strategy: mc_dropout
  mc_dropout_passes: 16
  mc_dropout_p: 0.1
  n_select: 64
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: ${DFT_BACKEND:-vasp}

  vasp:
    vasp_bin:         ${VASP_BIN}
    vasp_wrapper:     ${PROJ_ROOT}/deployments/perlmutter/launchers/_vasp-step-perlmutter.sh
    incar_template:   ${PROJ_ROOT}/examples/active_learning/INCAR.template
    kpoints_template: null            # KSPACING from INCAR (auto Gamma mesh)
    potcar_dir:       ${POTCAR_DIR}
    nodes_per_job: 1                  # small monolayer cell (4 atoms + vacuum)
    ranks_per_node: 4
    threads_per_rank: 16
    timeout_sec: 7200
    # NOTE: AL DFT backend runs single-point SCF labeling only; the in-plane
    # relaxation is done by the MLIP/MD stage. KSPACING auto-yields one k-point
    # along the large vacuum reciprocal vector, so no special 2D k-mesh is
    # needed. Phosphorene is a semiconductor -> Gaussian smearing (ISMEAR=0).
    extra_incar:
      ENCUT: "520"
      ISMEAR: "0"          # Gaussian smearing: phosphorene is a semiconductor
      SIGMA: "0.05"
      KSPACING: "0.25"
      LREAL: "Auto"
      NCORE: "4"

trainer:
  enabled: ${TRAINER_ENABLED:-true}
  train_script:   ${HYDRAGNN_DIR}/examples/mptrj/train.py
  train_launcher: ${TRAIN_LAUNCHER:-/global/cfs/projectdirs/m5216/mlupopa/matsim-agents/deployments/perlmutter/launchers/_hydragnn-train-step-perlmutter.sh}
  epochs_per_iter: 5
  nodes_for_train: 4
  ranks_per_node:  4

loop:
  n_iterations: 8
  out_dir: ${RUNS_ROOT}/${RUN_TAG}
  dataset_format: extxyz
  resume: true
  fail_fast: false
