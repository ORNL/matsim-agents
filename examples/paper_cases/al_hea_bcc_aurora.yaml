# =============================================================================
# Portability case: NbTaVHfZrTi BCC refractory HEA AL loop on ALCF Aurora.
#
# Aurora analogue of al_hea_bcc.yaml: the SAME active-learning loop (MLIP MD sampling +
# mc_dropout acquisition + VASP vasp_std labelling), retargeted to Aurora's Intel
# Data Center GPU Max. Only the vars/paths, the DFT + train launchers, the
# per-node rank layout, and the xpu device strings differ.
#
# Aurora node layout: 12 GPU tiles per node (ZE_FLAT_DEVICE_HIERARCHY=FLAT)
#   -> ranks_per_node=12, threads_per_rank=1 (the Aurora step wrappers bind
#   one core per rank).
#
# PROJ_ROOT, RUNS_ROOT, HYDRAGNN_DIR (and HYDRAGNN_FT_REPO where used) must be
# exported; the Aurora paper-case job sets them from the checkout.
#
# How to run (from the Aurora repo checkout):
#   qsub -v CASE=hea_bcc deployments/aurora/jobs/job-active-learning-paper-cases-aurora.sh
# =============================================================================
vars:
  PROJ_ROOT:    ${PROJ_ROOT:?export PROJ_ROOT to the Aurora matsim-agents checkout}
  RUNS_ROOT:    ${RUNS_ROOT:?export RUNS_ROOT}
  HYDRAGNN_DIR: ${HYDRAGNN_DIR:?export HYDRAGNN_DIR}
  HYDRAGNN_FT_REPO: ${HYDRAGNN_FT_REPO:?export HYDRAGNN_FT_REPO}
  RUN_TAG:      hea-bcc-aurora-al-001

  # Built by deployments/aurora/setup/build-vasp-gpu-aurora.sh.
  VASP_BIN:   ${PROJ_ROOT}/external/vasp6/src/vasp.6.6.1/bin/vasp_std
  POTCAR_DIR: ${PROJ_ROOT}/external/vasp6/potcar/potpaw_PBE.64

  INITIAL_LOGDIR: ${RUNS_ROOT}/al-models/iter0_logdir

mlip:
  # HydraGNN runs from .venv; MLIP_BACKEND=uma or mace uses .venv-uma / .venv-mace.
  backend: ${MLIP_BACKEND:-hydragnn}
  hydragnn:
    hydragnn_root: ${HYDRAGNN_DIR}
    ft_repo: ${HYDRAGNN_FT_REPO}
    logdir:         ${INITIAL_LOGDIR}
    checkpoint:     best_model.pt
    mlp_checkpoint: null
    charge: 0.0
    spin:   0.0
    precision:  fp32
    mlp_device: xpu
    ensemble_paths: []       # optional; add sibling seed logdirs to switch to ensemble
  uma:
    model_name: uma-s-1p1
    task_name:  omat
    device:     xpu
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear

md:
  seed_source:
    kind: compositions
    compositions:
      # Equimolar sextet
      - NbTaVHfZrTi
      # 5-element sub-lattice variants (one element dropped)
      - NbTaVHfZr
      - NbTaVHfTi
      - NbTaVZrTi
      - NbTaHfZrTi
      - NbVHfZrTi
      - TaVHfZrTi
    max_phases_per_composition: 2    # BCC + FCC prototypes per formula
    n_random: 6                      # pyXtal random unit-cell seeds (BCC SG=229 preferred)
    random_seed: 7
  timestep_fs: 2.0
  n_steps: 500
  temperature_K: 1200.0             # refractory; sample disordered high-T regime
  thermostat: langevin
  friction_inv_ps: 0.05
  sample_every: 20
  max_force_threshold_eV_per_A: 80.0
  max_displacement_A: 6.0

acquisition:
  strategy: mc_dropout              # single-checkpoint uncertainty, no ensemble needed
  mc_dropout_passes: 16
  mc_dropout_p: 0.1
  n_select: 200
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: ${DFT_BACKEND:-vasp}

  vasp:
    vasp_bin:         ${VASP_BIN}
    vasp_wrapper:     ${PROJ_ROOT}/deployments/aurora/launchers/_vasp-step-aurora.sh
    incar_template:   ${PROJ_ROOT}/examples/active_learning/INCAR.template
    kpoints_template: null            # use KSPACING from INCAR (auto Gamma mesh)
    potcar_dir:       ${POTCAR_DIR}
    timeout_sec: 10800
    extra_incar:
      ENCUT: "520"
      ISMEAR: "1"          # Methfessel-Paxton (order 1) for metallic BCC HEA
      SIGMA: "0.20"
      KSPACING: "0.25"
      NCORE: "4"

trainer:
  enabled: true
  promote_model: true          # explicitly use the validated candidate in the next iteration
  promotion_approved: true     # explicit acceptance after reviewing validation metrics
  validation_fraction: 0.2
  validation_reference_set: ${ELEMENTAL_REFERENCE_MANIFEST:?provide DFT-labelled elemental JSON manifest}
  validation_split_seed: 42
  train_script:   ${PROJ_ROOT}/src/matsim_agents/training/finetune_hydragnn_newhead.py
  train_launcher: ${PROJ_ROOT}/deployments/aurora/launchers/_hydragnn-train-step-aurora.sh
  epochs_per_iter: 5

loop:
  n_iterations: 12
  out_dir: ${RUNS_ROOT}/${RUN_TAG}
  dataset_format: extxyz
  resume: true
  fail_fast: false

# Placement (docs/resource-dispatch.md). AL stages run one after another, so
# training shares a device with the DFT pool.
resources:
  preset: aurora
  pools:
    dft:      {nodes: all, devices: all, threads_per_rank: 1, share_with: [training]}
    training: {nodes: 1, devices: 1, share_with: [dft]}
