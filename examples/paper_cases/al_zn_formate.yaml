# =============================================================================
# Paper test case: Zn(HCOO)2 — zinc formate, 3D metal-organic framework
#
# Scientific motivation (from Zekun Chen, 2026-06-10):
#   Zinc formate is one of the smallest dense MOFs: ZnO6 octahedra bridged by
#   formate (HCOO-) linkers. It is a feasibility benchmark for ML potentials on
#   hybrid inorganic-organic frameworks. The stability landscape to explore:
#     * alpha (Pna2_1) vs beta (P2_1/c) polymorphs
#     * guest-free framework breathing / linker libration
#     * proton ordering of the formate C-H and O coordination
#   Because the formate linker is organic, the inorganic prototype enumerator
#   cannot generate it -> 'paths' seed source with a supplied structure file.
#
#   NOTE (per email): for hybrid organic-inorganic MOFs a universal potential
#   (e.g. UMA) may label better than the inorganic-trained HydraGNN model.
#   This config uses HydraGNN for consistency with the other cases; swap the
#   hydragnn block / dft backend if a UMA labeler is preferred.
#
# Seed file (generated by singlepass.py, or supply your own):
#   examples/paper_cases/seeds/zn_formate_alpha.extxyz
#     python examples/paper_cases/singlepass.py --case zn_formate --seeds-only
#   The bundled builder is a SIMPLIFIED placeholder WITHOUT the formate H
#   atoms. Replace with a real CIF (incl. H) before any DFT labeling.
#
# How to run:
#   matsim-agents al validate-config examples/paper_cases/al_zn_formate.yaml
# =============================================================================

vars:
  PROJ_ROOT:    /global/cfs/projectdirs/m5216/mlupopa/matsim-agents
  RUNS_ROOT:    /global/cfs/projectdirs/m5216/mlupopa/runs
  HYDRAGNN_DIR: /global/cfs/projectdirs/m5216/mlupopa/matsim-agents/HydraGNN
  RUN_TAG:      zn-formate-mof-al-001

  SEED_XYZ:   ${PROJ_ROOT}/examples/paper_cases/seeds/zn_formate_alpha.extxyz
  VASP_BIN:   ${PROJ_ROOT}/external/vasp6/src/vasp.6.6.0/bin/vasp_std
  POTCAR_DIR: /global/cfs/projectdirs/m5216/mlupopa/POTCAR/PBE.54

  INITIAL_LOGDIR: ${RUNS_ROOT}/al-models/iter0_logdir

mlip:
  # Surrogate selector — switch backend with one env var, no file edits:
  #   matsim-agents al run <cfg>                  # HydraGNN (default; retrains each iter)
  #   MLIP_BACKEND=uma matsim-agents al run <cfg>  # frozen UMA foundation model
  backend: ${MLIP_BACKEND:-hydragnn}
  hydragnn:
    logdir:         ${INITIAL_LOGDIR}
    checkpoint:     best_model.pt
    mlp_checkpoint: null
    precision:  fp32
    mlp_device: cuda
    ensemble_paths: []
  uma:
    model_name: uma-s-1p1     # fairchem pretrained model (or local checkpoint path)
    task_name:  omol          # hybrid MOF → molecular/organic head
    device:     cuda
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear
  mace:
    # MACE-MP foundation model (mace-torch). Select with MLIP_BACKEND=mace;
    # size via MACE_MODEL (small|medium|large). Frozen by default (like UMA);
    # set MACE_RETRAIN=1 in the launcher to fine-tune each iteration.
    family:    ${MACE_FAMILY:-mace_mp}
    model:     ${MACE_MODEL:-medium}
    precision: fp64
    device:    cuda
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear

md:
  seed_source:
    # Hybrid organic-inorganic framework: must be supplied as a structure file.
    kind: paths
    paths:
      - ${SEED_XYZ}
    n_random: 3          # random framework-breathing / libration cells
    random_seed: 23
  timestep_fs: 0.5       # flexible framework + light H: short step
  n_steps: 200
  temperature_K: 300.0   # room-temperature sampling; preserve MOF topology
  thermostat: langevin
  friction_inv_ps: 0.2
  sample_every: 10
  max_force_threshold_eV_per_A: 40.0
  max_displacement_A: 3.0

acquisition:
  strategy: mc_dropout
  mc_dropout_passes: 16
  mc_dropout_p: 0.1
  n_select: 64
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: ${DFT_BACKEND:-vasp}

  vasp:
    vasp_bin:         ${VASP_BIN}
    vasp_wrapper:     ${PROJ_ROOT}/deployments/perlmutter/launchers/_vasp-step-perlmutter.sh
    incar_template:   ${PROJ_ROOT}/examples/active_learning/INCAR.template
    kpoints_template: null            # KSPACING from INCAR (auto Gamma mesh)
    potcar_dir:       ${POTCAR_DIR}
    nodes_per_job: 2                  # dense framework cell (~20+ atoms)
    ranks_per_node: 4
    threads_per_rank: 16
    timeout_sec: 14400
    # NOTE: AL DFT backend runs single-point SCF labeling only; framework
    # relaxation is done by the MLIP/MD stage. Zn formate is an insulator ->
    # Gaussian smearing (ISMEAR=0). LREAL=Auto speeds the large hybrid cell.
    extra_incar:
      ENCUT: "520"         # raised automatically if a POTCAR ENMAX demands it
      ISMEAR: "0"          # Gaussian smearing: insulating MOF
      SIGMA: "0.05"
      KSPACING: "0.30"     # dense framework, modest BZ sampling
      LREAL: "Auto"
      NCORE: "4"

trainer:
  enabled: ${TRAINER_ENABLED:-true}
  promote_model: true          # explicitly use the validated candidate in the next iteration
  promotion_approved: true     # explicit acceptance after reviewing validation metrics
  train_script:   ${HYDRAGNN_DIR}/examples/mptrj/train.py
  train_launcher: ${TRAIN_LAUNCHER:-/global/cfs/projectdirs/m5216/mlupopa/matsim-agents/deployments/perlmutter/launchers/_hydragnn-train-step-perlmutter.sh}
  epochs_per_iter: 5
  nodes_for_train: 4
  ranks_per_node:  4

loop:
  n_iterations: 8
  out_dir: ${RUNS_ROOT}/${RUN_TAG}
  dataset_format: extxyz
  resume: true
  fail_fast: false
