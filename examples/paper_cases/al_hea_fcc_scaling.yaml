# =============================================================================
# DFT-concurrency strong-scaling harness (derived from al_hea_fcc_cantor.yaml)
#
# Purpose: measure how the AL loop's DFT-labelling throughput scales with the
# node allocation. The loop dispatches up to (SLURM_JOB_NUM_NODES / nodes_per_job)
# VASP single-points concurrently, so submitting this SAME config at N = 1, 2, 4,
# 8 nodes yields a strong-scaling curve for a FIXED workload.
#
# Fixed workload: n_select = 32 with >=32 MD candidates guaranteed (5 random
# seeds x 10 samples = 50 candidates), so exactly 32 identical VASP single-points
# run per submission regardless of node count. One iteration only. The larger
# 32-frame workload (vs. an earlier 16-frame version) amortizes the single
# slowest/straggler frame over twice as many frames, directly shrinking the
# per-repeat throughput variance at high node counts.
#
# Submit with the companion job script, which sets a per-N RUN_TAG:
#   scripts/advanced/perlmutter/job-al-dft-scaling-perlmutter.sh
# =============================================================================

vars:
  PROJ_ROOT:    /global/cfs/projectdirs/m5216/mlupopa/matsim-agents
  RUNS_ROOT:    /global/cfs/projectdirs/m5216/mlupopa/runs
  HYDRAGNN_DIR: /global/cfs/projectdirs/m5216/mlupopa/matsim-agents/HydraGNN
  # RUN_TAG is injected per-submission (encodes the node count) so each point in
  # the scaling sweep writes to its own directory and never resumes another.
  RUN_TAG:      ${SCALE_TAG:-hea-fcc-scaling-N1}

  VASP_BIN:   ${PROJ_ROOT}/external/vasp6/src/vasp.6.6.0/bin/vasp_std
  POTCAR_DIR: /global/cfs/projectdirs/m5216/mlupopa/POTCAR/PBE.54

  INITIAL_LOGDIR: ${RUNS_ROOT}/al-models/iter0_logdir

mlip:
  backend: ${MLIP_BACKEND:-uma}
  hydragnn:
    logdir:         ${INITIAL_LOGDIR}
    checkpoint:     best_model.pt
    mlp_checkpoint: null
    precision:  fp32
    mlp_device: cuda
    ensemble_paths: []
  uma:
    model_name: uma-s-1p1
    task_name:  omat
    device:     cuda
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear

md:
  seed_source:
    kind: compositions
    compositions:
      - CrMnFeCoNi
      - Cr2MnFe2CoNi
      - CrMnFe2CoNi2
      - CrMnFeCoNi2
      - CrMn2FeCoNi
    # Equimolar/near-equimolar 5-element HEAs have no matching AFLOW prototype
    # (reduced signature (1,1,1,1,1) is absent from the 288-entry encyclopedia),
    # so each composition's seed comes from one pyXtal random structure. AL_SEED
    # is held fixed across node counts within one repeat (same draw at
    # N=1/2/4/8) and varied per repeat by the sweep wrapper, so averaging over
    # repeats dampens per-draw variability in the reported throughput.
    max_phases_per_composition: 1    # 1 seed/composition -> 5 seeds (keeps MD cost low)
    n_random: 1
    random_seed: ${AL_SEED:-13}
  timestep_fs: 2.0
  n_steps: 150                       # 150 / sample_every(15) = 10 frames per seed
  temperature_K: 1000.0
  thermostat: langevin
  friction_inv_ps: 0.08
  sample_every: 15
  max_force_threshold_eV_per_A: 60.0
  max_displacement_A: 5.0
  # Seed the MD RNG (Maxwell-Boltzmann velocities + Langevin thermostat noise)
  # with the same AL_SEED as the seed structures above, so within one repeat the
  # candidate pool is drawn identically at every node count (N=1/2/4/8). Varying
  # AL_SEED across repeats yields independent random workloads whose per-N wall
  # times are averaged to give a robust strong-scaling estimate.
  random_seed: ${AL_SEED:-13}

acquisition:
  strategy: mc_dropout
  mc_dropout_passes: 8
  mc_dropout_p: 0.1
  n_select: 32                       # FIXED workload: exactly 32 VASP jobs/iter
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: ${DFT_BACKEND:-vasp}

  vasp:
    vasp_bin:         ${VASP_BIN}
    vasp_wrapper:     ${PROJ_ROOT}/scripts/launchers/perlmutter/_vasp-step-perlmutter.sh
    incar_template:   ${PROJ_ROOT}/examples/active_learning/INCAR.template
    kpoints_template: null
    potcar_dir:       ${POTCAR_DIR}
    nodes_per_job: 1
    ranks_per_node: 4
    threads_per_rank: 16
    timeout_sec: 10800
    extra_incar:
      ENCUT: "520"
      ISMEAR: "1"
      SIGMA: "0.20"
      ISPIN: "2"
      KSPACING: "0.22"
      NCORE: "4"

trainer:
  enabled: false                     # scaling test: isolate the DFT stage

loop:
  n_iterations: 1                    # single batch of 32 single-points
  out_dir: ${RUNS_ROOT}/${RUN_TAG}
  dataset_format: extxyz
  resume: false                      # every scaling point starts fresh
  fail_fast: false
