# =============================================================================
# Portability case: phosphorene AL loop on OLCF Frontier (AMD MI250X) with the
# Quantum ESPRESSO backend.
#
# Cross-platform + cross-DFT-engine analogue of al_phosphorene_qe.yaml: the
# SAME active-learning loop (MLIP MD sampling + mc_dropout acquisition +
# QE pw.x labelling), retargeted from Perlmutter (NVIDIA A100) to Frontier
# (AMD MI250X). Only the vars/paths and the QE launcher differ; the loop,
# md, and acquisition blocks are identical to the Perlmutter QE config.
#
# Frontier node layout: 8 GCDs (logical GPUs) per node, 56 usable cores
# (7 per GCD) -> ranks_per_node=8, threads_per_rank=7.
#
# Run (from the Frontier repo checkout):
#   sbatch --export=ALL,AL_CONFIG=$PWD/examples/paper_cases/al_phosphorene_qe_frontier.yaml \
#       deployments/frontier/launchers/run-active-learning-frontier.sh
# =============================================================================

vars:
  PROJ_ROOT:    /lustre/orion/mat746/proj-shared/matsim-agents
  RUNS_ROOT:    /lustre/orion/mat746/proj-shared/runs
  HYDRAGNN_DIR: /lustre/orion/mat746/proj-shared/matsim-agents/HydraGNN
  RUN_TAG:      phosphorene-2d-qe-frontier-al-001

  SEED_XYZ:   ${PROJ_ROOT}/examples/paper_cases/seeds/phosphorene_black_P.extxyz
  PW_BIN:     ${PROJ_ROOT}/external/quantum-espresso/install-gpu/bin/pw.x
  PSEUDO_DIR: ${PROJ_ROOT}/external/quantum-espresso/src/pseudo

  INITIAL_LOGDIR: ${RUNS_ROOT}/al-models/iter0_logdir

mlip:
  # Frontier's venv is HydraGNN/ROCm (fairchem/UMA needs numpy>=2 and is not
  # installed there), so the platform-native MLIP is HydraGNN. Override with
  # MLIP_BACKEND=uma only on a node where fairchem-core is available.
  backend: ${MLIP_BACKEND:-hydragnn}
  hydragnn:
    logdir:         ${INITIAL_LOGDIR}
    checkpoint:     best_model.pt
    mlp_checkpoint: null
    precision:  fp32
    mlp_device: cuda
    ensemble_paths: []
  uma:
    model_name: uma-s-1p1
    task_name:  omat
    device:     cuda
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear

md:
  seed_source:
    kind: paths
    paths:
      - ${SEED_XYZ}
    n_random: 3
    random_seed: 17
  timestep_fs: 0.5
  n_steps: 200
  temperature_K: 300.0
  thermostat: langevin
  friction_inv_ps: 0.2
  sample_every: 10
  max_force_threshold_eV_per_A: 40.0
  max_displacement_A: 3.0

acquisition:
  strategy: mc_dropout
  mc_dropout_passes: 16
  mc_dropout_p: 0.1
  n_select: 32
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: ${DFT_BACKEND:-qe}

  qe:
    pw_bin:      ${PW_BIN}
    pw_wrapper:  ${PROJ_ROOT}/deployments/frontier/launchers/_qe-step-frontier.sh
    pseudo_dir:  ${PSEUDO_DIR}
    pseudopotentials:
      P: P.pbe-n-kjpaw_psl.1.0.0.UPF
    kpts:     [4, 4, 1]
    koffset:  [0, 0, 0]
    occupations: smearing
    smearing:    gaussian
    degauss_ry:  0.007
    nodes_per_job:    1
    ranks_per_node:   8      # 8 GCDs per Frontier node
    threads_per_rank: 7      # 56 usable cores / 8 GCDs
    timeout_sec:      7200

trainer:
  enabled: false

loop:
  n_iterations: 3
  out_dir: ${RUNS_ROOT}/${RUN_TAG}
  dataset_format: extxyz
  resume: true
  fail_fast: false
