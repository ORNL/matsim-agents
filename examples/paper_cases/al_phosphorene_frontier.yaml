# =============================================================================
# Portability case: Phosphorene (2D black-P allotrope) AL loop on OLCF Frontier
# with the VASP backend.
#
# Cross-platform analogue of al_phosphorene.yaml: the SAME active-learning loop
# (HydraGNN MD sampling + mc_dropout acquisition + VASP vasp_std labelling),
# retargeted from Perlmutter (NVIDIA A100) to Frontier (AMD MI250X). Only the
# vars/paths, the DFT + train launchers, and the per-node rank layout differ;
# the md, acquisition, and loop physics are identical to the Perlmutter config.
# (See al_phosphorene_qe_frontier.yaml for the cross-DFT-engine QE analogue.)
#
# Scientific motivation (from Zekun Chen, 2026-06-10):
#   Phosphorene (single-layer black phosphorus) is a puckered 2D semiconductor
#   with a direct, thickness-tunable band gap. Its covalent puckered network is
#   sensitive to small displacements -> an ideal MLIP force stress test.
#
# Seed file (generated by singlepass.py, or supply your own):
#   examples/paper_cases/seeds/phosphorene_black_P.extxyz
#
# Frontier node layout: 8 GCDs per node, 56 usable cores (7 per GCD)
#   -> ranks_per_node=8, threads_per_rank=7.
#
# How to run (from the Frontier repo checkout):
#   matsim-agents al validate-config examples/paper_cases/al_phosphorene_frontier.yaml
#   CASE=phosphorene sbatch deployments/frontier/jobs/job-active-learning-paper-cases-frontier.sh
# =============================================================================

vars:
  PROJ_ROOT:    ${PROJ_ROOT:-/lustre/orion/lrn070/proj-shared/mlupopa/matstim-folder/matsim-agents}
  RUNS_ROOT:    ${RUNS_ROOT:-/lustre/orion/lrn070/proj-shared/mlupopa/matstim-folder/runs}
  HYDRAGNN_DIR: ${HYDRAGNN_DIR:-/lustre/orion/lrn070/proj-shared/mlupopa/matstim-folder/HydraGNN}
  RUN_TAG:      phosphorene-2d-frontier-al-001

  SEED_XYZ:   ${PROJ_ROOT}/examples/paper_cases/seeds/phosphorene_black_P.extxyz
  VASP_BIN:   ${PROJ_ROOT}/external/vasp6/src/vasp.6.6.0/bin/vasp_std
  POTCAR_DIR: ${PROJ_ROOT}/external/vasp6/potcar/potpaw_PBE.64

  INITIAL_LOGDIR: ${RUNS_ROOT}/al-models/iter0_logdir

mlip:
  # Frontier's venv is HydraGNN/ROCm; UMA (fairchem) is not installed there.
  backend: ${MLIP_BACKEND:-hydragnn}
  hydragnn:
    logdir:         ${INITIAL_LOGDIR}
    checkpoint:     best_model.pt
    mlp_checkpoint: null
    precision:  fp32
    mlp_device: cuda           # torch HIP maps the "cuda" device string on MI250X
    ensemble_paths: []
  uma:
    model_name: uma-s-1p1
    task_name:  omat
    device:     cuda
    dropout:
      enabled: true
      p: 0.1
      target_layers: linear

md:
  seed_source:
    # Supply the monolayer seed explicitly (2D allotropes are not in the
    # inorganic prototype enumerator). Fall back to 'compositions' [P] below.
    kind: paths
    paths:
      - ${SEED_XYZ}
    # ---- fallback if seed file absent ----
    # kind: compositions
    # compositions:
    #   - P
    # max_phases_per_composition: 3
    n_random: 3          # random strained / rumpled monolayer cells
    random_seed: 17
  timestep_fs: 0.5       # light element + soft pucker mode: short step
  n_steps: 200
  temperature_K: 300.0
  thermostat: langevin
  friction_inv_ps: 0.2
  sample_every: 10
  max_force_threshold_eV_per_A: 40.0
  max_displacement_A: 3.0

acquisition:
  strategy: mc_dropout
  mc_dropout_passes: 16
  mc_dropout_p: 0.1
  n_select: 64
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: ${DFT_BACKEND:-vasp}

  vasp:
    vasp_bin:         ${VASP_BIN}
    vasp_wrapper:     ${PROJ_ROOT}/deployments/frontier/launchers/_vasp-step-frontier.sh
    incar_template:   ${PROJ_ROOT}/examples/active_learning/INCAR.template
    kpoints_template: null            # KSPACING from INCAR (auto Gamma mesh)
    potcar_dir:       ${POTCAR_DIR}
    nodes_per_job: 1                  # small monolayer cell (4 atoms + vacuum)
    ranks_per_node: 8                 # 8 GCDs per Frontier node
    threads_per_rank: 7               # 56 usable cores / 8 GCDs
    timeout_sec: 7200
    # NOTE: AL DFT backend runs single-point SCF labeling only; the in-plane
    # relaxation is done by the MLIP/MD stage. KSPACING auto-yields one k-point
    # along the large vacuum reciprocal vector, so no special 2D k-mesh is
    # needed. Phosphorene is a semiconductor -> Gaussian smearing (ISMEAR=0).
    extra_incar:
      ENCUT: "520"
      ISMEAR: "0"          # Gaussian smearing: phosphorene is a semiconductor
      SIGMA: "0.05"
      KSPACING: "0.25"
      LREAL: "Auto"
      NCORE: "4"

trainer:
  enabled: true
  promote_model: true          # explicitly use the validated candidate in the next iteration
  promotion_approved: true     # explicit acceptance after reviewing validation metrics
  train_script:   ${HYDRAGNN_DIR}/examples/mptrj/train.py
  train_launcher: ${PROJ_ROOT}/deployments/frontier/launchers/_hydragnn-train-step-frontier.sh
  epochs_per_iter: 5
  nodes_for_train: 4
  ranks_per_node:  8

loop:
  n_iterations: 8
  out_dir: ${RUNS_ROOT}/${RUN_TAG}
  dataset_format: extxyz
  resume: true
  fail_fast: false
