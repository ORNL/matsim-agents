# =============================================================================
# Active-learning configuration with LLM-generated seed structures.
#
# At launch, the LLM (vLLM/Ollama/HF/etc.) is asked to expand the natural-
# language `prompt` below into a list of chemical formulas. Each formula is
# turned into prototype crystal seeds via matsim_agents.discovery and used as
# the starting set for the HydraGNN-driven MD sampler.
#
# The list of compositions returned by the LLM is persisted under
#   <out_dir>/seeds/llm_proposed_compositions.json
# so the run is fully reproducible.
#
# All paths use the same ${VAR} / ${VAR:-default} substitution as the main
# example. Override at runtime e.g.:
#   PROJ_ROOT=$PWD LLM_BASE_URL=http://node42:8000/v1 \
#       matsim-agents al validate-config examples/active_learning/al_config.prompt.example.yaml
# =============================================================================

vars:
  PROJ_ROOT:    /lustre/orion/mat746/proj-shared/matsim-agents
  RUNS_ROOT:    /lustre/orion/mat746/proj-shared/runs
  HYDRAGNN_DIR: /lustre/orion/mat746/proj-shared/HydraGNN
  RUN_TAG:      al-run-prompt-001

  VASP_BIN:     ${PROJ_ROOT}/external/vasp6/src/vasp.6.6.0/bin/vasp_std
  POTCAR_DIR:   /lustre/orion/mat746/proj-shared/POTCAR/PBE.54
  INITIAL_LOGDIR: ${RUNS_ROOT}/al-models/iter0_logdir

  # LLM endpoint (override LLM_BASE_URL when your vLLM server moves).
  LLM_PROVIDER: vllm
  LLM_MODEL:    Qwen/Qwen2.5-72B-Instruct
  LLM_BASE_URL: http://localhost:8000/v1

# ---------------------------------------------------------------------------

hydragnn:
  logdir: ${INITIAL_LOGDIR}
  checkpoint: best_model.pt
  mlp_checkpoint: null
  charge: 0.0
  spin: 0.0
  precision: fp32
  mlp_device: cuda
  ensemble_paths: []

md:
  # LLM-driven seed source.
  seed_source:
    kind: prompt
    prompt: >
      Pb-free halide double perovskites with band gap near 1.5 eV
      for thin-film photovoltaics. Include both Sn-substituted and
      Ag/Bi-based compositions.
    llm:
      provider: ${LLM_PROVIDER}        # ollama | vllm | openai | anthropic | huggingface
      model:    ${LLM_MODEL}
      base_url: ${LLM_BASE_URL}
      temperature: 0.0
    max_compositions: 6                # cap on LLM output
    max_phases_per_composition: 2      # discovery returns up to N prototypes/formula
    n_random: 0                        # optional pyXtal random-search seeds (requires pyxtal)
    random_seed: 0
  timestep_fs: 1.0
  n_steps: 200
  temperature_K: 600.0
  thermostat: langevin
  friction_inv_ps: 0.1
  sample_every: 10
  max_force_threshold_eV_per_A: 50.0
  max_displacement_A: 5.0

acquisition:
  strategy: random
  n_select: 256
  mc_dropout_passes: 8
  mc_dropout_p: 0.1
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: ${DFT_BACKEND:-vasp}
  vasp:
    vasp_bin:        ${VASP_BIN}
    vasp_wrapper:    ${PROJ_ROOT}/scripts/launchers/frontier/_vasp-step-frontier.sh
    incar_template:  ${PROJ_ROOT}/examples/active_learning/INCAR.template
    kpoints_template: null
    potcar_dir:      ${POTCAR_DIR}
    nodes_per_job: 1
    ranks_per_node: 8
    threads_per_rank: 7
    timeout_sec: 7200
    extra_incar:
      NCORE: "8"

trainer:
  enabled: true
  train_script:   ${HYDRAGNN_DIR}/examples/mptrj/train.py
  train_launcher: ${PROJ_ROOT}/scripts/launchers/frontier/_hydragnn-train-step-frontier.sh
  epochs_per_iter: 5
  nodes_for_train: 8
  ranks_per_node: 8

loop:
  n_iterations: 10
  out_dir: ${RUNS_ROOT}/${RUN_TAG}
  dataset_format: extxyz
  resume: true
  fail_fast: false
