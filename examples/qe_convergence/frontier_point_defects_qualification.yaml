# Qualification matrix at the provisional recommendation (open items 1 and 2 of
# examples/fusion_bcc_1024/dft-parameterization.md): the smearing scan rerun at the production
# mesh and cutoffs, a denser-mesh plateau check beyond 7x7x7, and a denser-cutoff plateau check
# above 100/1200. Run on OLCF Frontier.
#
# 1. python -m matsim_agents.workflows.qualification_cells cells.yaml $OUT/cells  (cells exist)
# 2. python -m matsim_agents.workflows.numerical_convergence this.yaml plan
# 3. ... submit --job-manifest $OUT/jobs.jsonl, then collect, then analyse
#
# Each run is one job on one whole node (8 GCDs, one rank per GCD). Each scan reference is its
# last value; a run past the limit is unusable, never converged. The execution layer caps a job
# at 2 h; 100/1200 Ry on 54 sites may time out at 7x7x7 and is then retried or recorded unusable.
protocol: point_defects
out_dir: /lustre/orion/lrn110/proj-shared/matsim-agents/outputs/qe-convergence/point_defects_qualification
label: ""
base:
  pseudo_dir: /lustre/orion/lrn110/proj-shared/cache/pseudopotentials/pslibrary-1.0.0-pbe-paw
  pseudo_manifest: deployments/common/pseudopotentials/pslibrary-1.0.0-pbe-paw.yaml
  pseudopotentials:
    W: W.pbe-spn-kjpaw_psl.1.0.0.UPF
    Re: Re.pbe-spn-kjpaw_psl.1.0.0.UPF
    He: He.pbe-kjpaw_psl.1.0.0.UPF
  ecutwfc_ry: 100.0
  ecutrho_ry: 1200.0
  kspacing_inv_A: 0.10
  smearing: mv
  degauss_ry: 0.010
  # Scan baseline is one decade tighter than the production conv_thr (1e-7) so meV-level scan
  # differences are not SCF noise.
  conv_thr_ry: 1.0e-8
cases:
  - {name: bulk, structure: outputs/qe-convergence/point_defects/cells/bulk.extxyz, kind: bulk}
  - {name: vacancy, structure: outputs/qe-convergence/point_defects/cells/vacancy.extxyz, kind: vacancy}
  - {name: sub_Re, structure: outputs/qe-convergence/point_defects/cells/sub_Re.extxyz, kind: substitution}
  - {name: int_He, structure: outputs/qe-convergence/point_defects/cells/int_He.extxyz, kind: interstitial}
scans:
  # Open item 1: degauss at the production mesh and cutoffs; reference 0.005.
  - parameter: smearing
    values: [0.020, 0.010, 0.005]
  # Open item 2a: plateau beyond 7x7x7 (0.088 -> 8x8x8 on the 9.51 A cell); reference 8x8x8.
  - parameter: kpoints
    values: [0.12, 0.10, 0.088]
  # Open item 2b: plateau above 100/1200; reference 110/1320. 90/1080 re-measures the known
  # 1.09 meV/atom gap at the production mesh.
  - parameter: cutoff
    values: [[90, 1080], [100, 1200], [110, 1320]]
derived:
  - {name: vacancy_formation_eV, terms: {vacancy: 1.0, bulk: -0.9815}}
criteria: {}
resources:
  launcher:
    - bash
    - -c
    - "NRANKS=8 OMP_NUM_THREADS=7 bash /lustre/orion/lrn110/proj-shared/matsim-agents/deployments/frontier/launchers/run-pw-gpu-frontier.sh {input} -nk 8 > {output} 2> {output}.err"
  time_limit: "02:00:00"
  account: LRN110
  qos: normal
  partition: batch
  gpus: 8
  max_outstanding: 16
