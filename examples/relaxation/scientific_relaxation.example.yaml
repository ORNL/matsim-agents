# Choose: mlip | dft | mlip-dft
mode: mlip-dft
structure_path: structures/Si.vasp
output_root: runs

geometry:
  relax_atoms: true
  relax_cell: true
  fixed_atom_indices: []
  charge: 0.0
  spin: 0.0
  preserve_symmetry: false

mlip:
  mlip_backend: uma
  uma_model_name: uma-s-1p1
  uma_task: omat
  mlp_device: cuda

dft:
  backend: qe
  launcher: pw.x
  pseudo_dir: /path/to/pseudopotentials
  settings: {}

# DFT is expensive and therefore requires an explicit approval by default.
dft_approved: false
approvals:
  before_dft: true
  before_retraining: true
  before_model_promotion: true

max_steps: 200
force_tolerance_eV_per_A: 0.02
