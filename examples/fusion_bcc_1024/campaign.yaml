# Production 1,024-atom W-Ta-Cr-V-Hf-Mo QE campaign. Validated by
# matsim_agents.workflows.full_supercell_campaign before any input is written.
campaign_id: wtacrvhfmo-1024
parent_supercell:
  lattice: bcc
  conventional_repeats: [8, 8, 8]
  expected_parent_atoms: 1024
  lattice_parameter: 3.16
  ordering: random
  seed: 1
  composition: {W: 640, Ta: 128, Cr: 64, V: 96, Hf: 32, Mo: 64}
numerical_qualification:
  require_full_parent_supercell: true
  prohibit_smaller_cell_substitution: true
# Every listed element is tried nonmagnetic, ferromagnetic and antiferromagnetic (two-sublattice
# collinear) in the parent and in each defect cell; the lowest converged energy per structure
# is its reference. Starting values only: DFT decides the final moments. 0.1 matches the Frontier
# Cr smearing scans (examples/qe_convergence/frontier_cr_magnetic.yaml).
magnetism:
  elements:
    Cr: {moment_muB: 1.0, qe_starting_magnetization: 0.1}
defects:
  vacancy_site: 0
  interstitial_site: 0
  interstitial_species: W
  interstitial_site_type: octahedral
  frenkel_site: 5
  frenkel_anchor: 40
  divacancy_site: 0
  divacancy_shell: 1
qe:
  # pslibrary 1.0.0 PBE PAW, downloaded 2026-11-24; checksums in SHA256SUMS next to the files.
  # Frontier copy: <project-shared>/cache/pseudopotentials/pslibrary-1.0.0-pbe-paw
  # Retrieve: curl -sfS -O https://pseudopotentials.quantum-espresso.org/upf_files/<file>
  # then `sha256sum -c SHA256SUMS`. Provenance in SOURCE.txt (see docs/radiation-damage-status.md).
  pseudo_dir: ${MATSIM_PSEUDO_DIR}
  pseudopotentials:
    W: W.pbe-spn-kjpaw_psl.1.0.0.UPF
    Ta: Ta.pbe-spn-kjpaw_psl.1.0.0.UPF
    Cr: Cr.pbe-spn-kjpaw_psl.1.0.0.UPF
    V: V.pbe-spnl-kjpaw_psl.1.0.0.UPF
    Hf: Hf.pbe-spn-kjpaw_psl.1.0.0.UPF
    Mo: Mo.pbe-spn-kjpaw_psl.1.0.0.UPF
    # Transmutation products and gas species for the radiation campaign.
    Re: Re.pbe-spn-kjpaw_psl.1.0.0.UPF
    Os: Os.pbe-spn-kjpaw_psl.1.0.0.UPF
    H: H.pbe-kjpaw_psl.1.0.0.UPF
    He: He.pbe-kjpaw_psl.1.0.0.UPF
  # Cutoff classes, kept apart on purpose:
  #  1. Pseudopotential-recommended minima (UPF headers, this library): wfc max 53.8 Ry (Os),
  #     rho max 645 Ry (V). Enforced by backends.dft.pseudo_validation; below these is rejected.
  #  2. The values below are the evidence-based provisional recommendation from the 54-site W
  #     convergence scans (deployments/common/qe-protocols.yaml, provisional_recommendation;
  #     detail in dft-parameterization.md). conv_thr is qualified; the k-mesh is the k-spacing
  #     0.10 2pi/A equivalent (3x3x3 on this 25.28 A cell, derived, not run); 100/1200 Ry and
  #     degauss 0.010 are provisional and NOT shown converged.
  #  3. Numerically qualified production values: none yet. Every protocol in
  #     deployments/common/qe-protocols.yaml is unqualified.
  # The former 51/650 Ry sat below the Os wfc recommendation and is diagnostic-only; the former
  # 60/720 Ry, 2x2x2, degauss 0.02, conv_thr 1e-6 pre-dated the scans.
  ecutwfc_ry: 100.0
  ecutrho_ry: 1200.0
  smearing: mv
  degauss_ry: 0.010
  kpts: [3, 3, 3]
  conv_thr_ry: 1.0e-7
  mixing_beta: 0.2
  neb_images: 5
slurm:
  account: LRN110
  qos: debug
  partition: batch
  nodes: 8
  walltime: "02:00:00"
  job_name: qe-1024-validation
  max_concurrent_jobs: 1
transmutation:
  # Synthetic W -> Re/Os substitutions for the radiation campaign (counts are not an inventory).
  host: W
  examples:
    - {name: Re5, products: {Re: 5}, seed: 1}
    - {name: Re3Os2, products: {Re: 3, Os: 2}, seed: 2}
    - {name: Re2Os1, products: {Re: 2, Os: 1}, seed: 3, with_vacancy_he: true}
