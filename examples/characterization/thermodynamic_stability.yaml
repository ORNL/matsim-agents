# Is MgO rocksalt thermodynamically stable against the declared Mg-O phases?
# This needs converged DFT for MgO and a ReferenceEnergySet computed with the
# same DFT method (same signature): Mg and O elemental energies and at least one
# competing Mg-O phase. Produce references.json yourself (see
# docs/characterization.md); this example ships no reference energies.
#   matsim-agents characterize examples/characterization/thermodynamic_stability.yaml
contract_id: mgo-rocksalt-stability
objective: Is MgO rocksalt on the Mg-O convex hull?
formula: MgO
recipe: thermodynamic_stability
structures:
  - structures/MgO-rocksalt.vasp
reference_energies: references.json
methods:
  dft:
    backend: qe
    launcher: pw.x
    pseudo_dir: /path/to/pseudopotentials
    # The references and MgO must share one method: fix what pw.x would
    # otherwise choose per composition. k-points follow each cell's size.
    settings:
      ecutwfc_ry: 60
      ecutrho_ry: 480
      occupations: smearing
      pseudopotentials:
        Mg: Mg.pbe-spnl-kjpaw_psl.1.0.0.UPF
        O: O.pbe-n-kjpaw_psl.0.1.UPF
  # Must equal the reference set's method_signature.
  dft_method_signature: qe-pbe-pslibrary-ecut60-smearing
# Atoms and cell are relaxed (the default; stability requires it).
tolerances:
  force_tolerance_eV_per_A: 0.02
  hull_tolerance_eV_per_atom: 0.0
budget:
  max_dft_calculations: 1
# DFT waits for explicit approval; set true once the calculation is approved.
dft_approved: false
