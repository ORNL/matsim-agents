# Aurora XPU qualification: HydraGNN BEST6 logdir, branch-7 (OMat24) head only.
# HYDRAGNN_BEST6_LOGDIR is exported by deployments/common/hydragnn-env.sh, which
# job-qualify-mlip-xpu-aurora.sh sources.
mlip:
  backend: hydragnn
  logdir: ${HYDRAGNN_BEST6_LOGDIR}
  inference_head: OMat24
  precision: fp32
  device: xpu
