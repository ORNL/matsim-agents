preview: {nodes: 1, spare_devices: [8, 9, 10, 11]}
resources:
  preset: aurora
  pools:
    llm:
      nodes: 1
      devices: [0, 1, 2, 3, 4, 5, 6, 7]
      servers:
        - name: model
          kind: managed-vllm
          model: ${MODEL_ROOT:?export MODEL_ROOT=<directory of model snapshots>}/Qwen3-235B-A22B-Instruct-2507
          served_name: Qwen3-235B-A22B-Instruct-2507
          tensor_parallel_size: 8
          max_model_len: 16384
          startup_timeout_s: 3600
          launcher:
            - bash
            - ${PROJECT_ROOT:?export PROJECT_ROOT=<matsim-agents checkout>}/deployments/aurora/launchers/vllm-server-aurora.sh
          extra_args: [--max-num-seqs, "1", --compilation-config, '{"cudagraph_mode":"PIECEWISE"}']