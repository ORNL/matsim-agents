preview: {nodes: 1, spare_devices: [4, 5, 6, 7, 8, 9, 10, 11]}
resources:
  preset: aurora
  pools:
    llm:
      nodes: 1
      devices: [0, 1, 2, 3]
      servers:
        - name: model
          kind: managed-vllm
          model: ${MODEL_ROOT:?export MODEL_ROOT=<directory of model snapshots>}/Gemma-4-26B-A4B-it
          served_name: Gemma-4-26B-A4B-it
          tensor_parallel_size: 4
          max_model_len: 65536
          startup_timeout_s: 2700
          launcher:
            - bash
            - ${PROJECT_ROOT:?export PROJECT_ROOT=<matsim-agents checkout>}/deployments/aurora/launchers/vllm-server-aurora.sh
          extra_args: [--enforce-eager, --max-num-seqs, "1"]