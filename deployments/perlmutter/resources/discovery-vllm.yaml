# Discovery chat on one Perlmutter node: matsim-agents starts a vLLM server on
# GPU 0 and relaxes candidates concurrently on GPUs 1-3.
#   matsim-agents resources plan deployments/perlmutter/resources/discovery-vllm.yaml
#   matsim-agents chat --resources deployments/perlmutter/resources/discovery-vllm.yaml ...
preview: {nodes: 1}
resources:
  preset: perlmutter-gpu
  pools:
    llm:
      nodes: 1
      devices: [0]
      servers:
        - name: proposer
          kind: managed-vllm
          model: ${MODEL_ROOT:?export MODEL_ROOT=<directory of model snapshots>}/Qwen2.5-14B-Instruct
          max_model_len: 16384
          launcher:
            - bash
            - ${PROJECT_ROOT:?export PROJECT_ROOT=<matsim-agents checkout>}/deployments/perlmutter/launchers/vllm-server-perlmutter.sh
          extra_args: [--enforce-eager]
    mlip: {nodes: 1, devices: [1, 2, 3]}
