# LLM deployment qualification: one vLLM server for Qwen2.5-14B-Instruct on all four A100s (tensor parallel 4),
# started by `matsim-agents resources serve` in job-llm-check-perlmutter.sh.
#   matsim-agents resources plan deployments/perlmutter/resources/llm-check.yaml
preview: {nodes: 1}
resources:
  preset: perlmutter-gpu
  pools:
    llm:
      nodes: 1
      devices: all
      servers:
        - name: model
          kind: managed-vllm
          model: ${MODEL_ROOT:?export MODEL_ROOT=<directory of model snapshots>}/Qwen2.5-14B-Instruct
          max_model_len: 8192
          launcher:
            - bash
            - ${PROJECT_ROOT:?export PROJECT_ROOT=<matsim-agents checkout>}/deployments/perlmutter/launchers/vllm-server-perlmutter.sh
          extra_args: [--trust-remote-code, --no-enable-log-requests, --enforce-eager]
