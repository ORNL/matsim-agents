# Multi-node LLM qualification: Qwen3-235B-A22B-Instruct-2507 served by one vLLM
# server across two Perlmutter nodes (Ray cluster, tensor parallel 8), the
# two-node layout of the qualified campaign panel. Submit job-llm-check-perlmutter.sh
# with `sbatch -N 2` and MATSIM_RESOURCES pointing here.
#   matsim-agents resources plan deployments/perlmutter/resources/llm-check-multinode.yaml --nodes 2
preview: {nodes: 2}
resources:
  preset: perlmutter-gpu
  pools:
    llm:
      nodes: 2
      servers:
        - name: model
          kind: managed-vllm
          model: ${MODEL_ROOT:?export MODEL_ROOT=<directory of model snapshots>}/Qwen3-235B-A22B-Instruct-2507
          served_name: Qwen/Qwen3-235B-A22B-Instruct-2507
          tensor_parallel_size: 8
          max_model_len: 8192
          startup_timeout_s: 3600
          launcher:
            - bash
            - ${PROJECT_ROOT:?export PROJECT_ROOT=<matsim-agents checkout>}/deployments/perlmutter/launchers/vllm-server-perlmutter.sh
          extra_args: [--dtype, bfloat16, --trust-remote-code, --enforce-eager]
