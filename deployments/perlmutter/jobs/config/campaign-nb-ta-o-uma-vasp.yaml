mlip:
  backend: uma
  uma:
    model_name: uma-s-1p1
    task_name: omat
    device: cuda

md:
  seed_source:
    kind: compositions
    compositions: [NbO2]
    max_phases_per_composition: 3
    n_random: 0
  timestep_fs: 1.0
  n_steps: 40
  temperature_K: 300.0
  thermostat: langevin
  friction_inv_ps: 0.2
  sample_every: 10
  max_force_threshold_eV_per_A: 40.0
  max_displacement_A: 3.0
  random_seed: 42

acquisition:
  strategy: random
  n_select: 2
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: vasp
  max_concurrent_jobs: 1
  vasp:
    vasp_bin: ${MATSIM_VASP_BIN:?export MATSIM_VASP_BIN}
    vasp_wrapper: ${PROJECT_ROOT:?export PROJECT_ROOT}/deployments/perlmutter/launchers/_vasp-step-perlmutter.sh
    incar_template: ${PROJECT_ROOT:?export PROJECT_ROOT}/examples/active_learning/INCAR.template
    kpoints_template: null
    potcar_dir: ${MATSIM_VASP_POTCAR_DIR:?export MATSIM_VASP_POTCAR_DIR}
    nodes_per_job: 1
    ranks_per_node: 4
    threads_per_rank: 16
    timeout_sec: 3600
    extra_incar:
      ENCUT: "520"
      EDIFF: "1E-6"
      ISMEAR: "0"
      SIGMA: "0.05"
      KSPACING: "0.25"
      KGAMMA: ".TRUE."
      LASPH: ".TRUE."
      LMAXMIX: "4"

trainer:
  enabled: false

loop:
  n_iterations: 1
  out_dir: /overridden/by/campaign
  dataset_format: extxyz
  resume: true
  fail_fast: true