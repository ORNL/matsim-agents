title: "Matsim-Agents Materials Discovery Challenge"
description: |
  Multi-task competition for atomistic ML: formation energy, force prediction, structure relaxation,
  AI-accelerated DFT, and phase stability ranking. Test set covers five diverse material classes,
  each with ideal crystal structures and defect variants:
    1. 2D monolayers      — graphene, h-BN, MoS2, WS2, MoSe2, phosphorene
    2. Intermetallic phases — Ni3Al (L12), NiAl (B2), FePt (L10), Fe3Al (DO3), Cu3Au, NiTi (B19')
    3. BCC high-entropy alloy — Nb-Ta-V-Hf-Zr-Ti, equiatomic, 128-atom supercells
    4. Critical minerals  — TiO2 (rutile), CeO2 (fluorite), LiCoO2, LiFePO4, MgAl2O4 (spinel),
                            CoS2 (pyrite), La2O3, Al2O3 (corundum), SiC (zinc blende),
                            WC (hexagonal), Nd2Fe14B
    5. Catalysis slabs    — Pt(111), Cu(100), Pd(111), Pd0.75Cu0.25(111), Ni(111),
                            Au(111), Ru(0001), Fe(110), Co(0001)
  Defects represented: point vacancies, antisites, and interstitials (H in BCC HEA).
  Structures generated by: public_data/generate_structures.py
image: "public_data/logo.png"
has_registration: true
phases:
  - name: "Formation Energy Prediction"
    description: "Predict formation energies for a set of test structures."
    scoring_program: "scoring_program/score.py"
    reference_data: "reference_data/"
    starting_kit: "starting_kit/"
  - name: "Force Prediction"
    description: "Predict atomic forces for each structure."
    scoring_program: "scoring_program/score.py"
    reference_data: "reference_data/"
    starting_kit: "starting_kit/"
  - name: "Structure Relaxation"
    description: "Submit relaxed structures. Scored by RMSD to DFT-relaxed."
    scoring_program: "scoring_program/score.py"
    reference_data: "reference_data/"
    starting_kit: "starting_kit/"
  - name: "AI-Accelerated DFT Relaxation"
    description: "Submit AI-relaxed structures. Scored by reduction in DFT SCF steps."
    scoring_program: "scoring_program/score.py"
    reference_data: "reference_data/"
    starting_kit: "starting_kit/"
  - name: "Phase Stability Ranking"
    description: "Rank phase stability or predict formation energies for a set of polymorphs."
    scoring_program: "scoring_program/score.py"
    reference_data: "reference_data/"
    starting_kit: "starting_kit/"
input_data: "public_data/"
output_data: "output/"

# ── Leaderboard configuration ────────────────────────────────────────────────
# During the competition, only public_* metrics are shown (scored on ~30 % of
# structures).  After the competition closes, reconfigure to show private_*
# metrics for the final ranking (scored on the remaining ~70 %).
#
# The split is deterministic and reproducible: see reference_data/create_split.py
# (SEED=42, PUBLIC_FRACTION=0.30, stratified by formula group).
#
# Participants can query the public leaderboard as often as allowed, but cannot
# recover private labels because:
#   1. private_ids.txt is inside reference_data/ (server-side only).
#   2. Submission rate is limited (max_submissions_per_day below).
#   3. The private partition is never scored until the competition ends.
#
# To switch to final ranking at competition end: change "public_" → "private_"
# in the key fields below (or add both sets and reconfigure via the UI).
leaderboard:
  columns:
    - title: "Overall Score"
      key: public_overall_score
      index: 0
      default: true
      sorting: desc
    - title: "Energy MAE eV/atom"
      key: public_Task1_energy_MAE_eV_per_atom
      index: 1
      sorting: asc
    - title: "Forces MAE eV/Å"
      key: public_Task2_forces_MAE_eV_per_A
      index: 2
      sorting: asc
    - title: "Relaxation RMSD Å"
      key: public_Task3_relaxation_RMSD_A
      index: 3
      sorting: asc
    - title: "Phase Stability ρ"
      key: public_Task5_phase_spearman_rho
      index: 4
      sorting: desc

max_submissions_per_day: 3
