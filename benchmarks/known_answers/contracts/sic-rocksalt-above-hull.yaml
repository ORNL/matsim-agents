# Known-answer case sic-rocksalt-above-hull; see benchmarks/known_answers/README.md.
contract_id: known-answer-sic-rocksalt-above-hull
objective: Is rocksalt SiC on the Si-C convex hull?
formula: SiC
recipe: thermodynamic_stability
structures:
- ../structures/SiC-rocksalt.vasp
reference_energies: ../references.json
methods:
  dft:
    backend: qe
    launcher: [pw.x, -in, "{input}"]
    pseudo_dir: /global/common/software/nersc9/espresso/pseudo
    settings:
      ecutwfc_ry: 45
      ecutrho_ry: 360
      occupations: smearing
      pseudopotentials:
        Si: Si.pbe-nl-rrkjus_psl.1.0.0.UPF
        C: C.pbe-n-kjpaw_psl.1.0.0.UPF
  dft_method_signature: qe-pbe-pslibrary-ecut45-smearing
tolerances:
  force_tolerance_eV_per_A: 0.02
  max_relaxation_steps: 100
  hull_tolerance_eV_per_atom: 0.005
budget:
  max_dft_calculations: 1
dft_approved: true
