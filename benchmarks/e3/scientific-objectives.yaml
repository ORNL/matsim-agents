schema_version: 1
campaign: E3-MLIP
status: benchmark_protocol_frozen
supersedes_for_scientific_reporting: e3-unified-six-material-v1
campaign_separation:
  e3_mlip: acquisition_uses_frozen_pretrained_mlip_evidence
  e3_dft: acquisition_uses_qualified_first_principles_evidence
  share_questions_and_metric_definitions_where_applicable: true
  keep_evidence_fidelity_costs_and_artifacts_separate: true
  preserve_historical_e3_dft_ids_results_protocol_and_budgets: true

primary_question: >-
  Under a fixed three-round, 64-GPU-per-round budget, what candidate-generation,
  structural-coverage, relaxation-convergence, and runtime outcomes are observed
  for LLM-guided E3-MLIP exploration in each of the six material classes?
comparative_claims: out_of_scope_single_strategy_and_seed

material_scope:
  classes: [lifepo4, phosphorene, zn_formate_mof, nb_ta_o, bcc_refractory, fcc_cantor]
  all_classes_mandatory: true
  rounds_per_class: 3
  max_unique_candidates_per_class_round: 64
  max_logical_optimizations: 1152
  equal_per_class_maximum: 192
  one_seed: 20261113
  class_generation_matrix: research/paper/e3/e3-mlip-exploration-plan.md
  no_class_omission_due_to_workflow_maturity: true
  reporting: per_class_plus_equal_weight_macro_and_pooled_totals

pre_campaign_gates:
  model_selection:
    status: primary_checkpoint_selected_by_user
    selected_primary_checkpoint: mace-omat-0-medium
    official_checkpoint_name: MACE-OMAT-0 medium
    mace_torch_loader_alias: medium-omat-0
    training_dataset: OMat24
    artifact_relative_path: mace/maceomat0mediummodel
    checkpoint_sha256: d4b14be9afa294eebdbe31a0280b26a0fa29715771e978cbfd3ca24e0d90307a
    verified_campaign_species: [C, Co, Cr, Fe, H, Hf, Li, Mn, Nb, Ni, O, P, Ta, Ti, V, Zn, Zr]
    species_compatibility: loaded_checkpoint_atomic_numbers
    selected_head: default
    selection_scope: common_frozen_E3_MLIP_campaign_model
    class_specific_transfer_limitations_must_be_reported: true
    candidates_are_class_specific: true
    checkpoint_hash_required: verified_and_enforced_at_round_start
    trainable: false
  scientific_endpoint:
    status: descriptive_relaxation_and_coverage_metrics
    candidate_level_discovery_claims: prohibited_without_separate_preregistered_endpoint
    evidence: frozen_primary_mlip_only
    independent_validation: out_of_scope_for_e3_mlip
  candidate_generation:
    status: must_be_frozen
    record_generator_seed_constraints_and_versions: true
    deduplicate_by: [composition, symmetry_canonical_structure, structure_hash]
    max_candidates_per_class_round: 64
    rounds_per_class: 3
    one_candidate_per_gpu_per_round: true
    candidates_per_tier_floor_each_round: 1
  execution:
    strategies: [LLM-guided adaptation]
    dft_or_vasp_evidence_and_submission: prohibited
    campaign_start_requires_approved_model_protocol_budget_and_resource_authorization: true
    geometry_task_hard_deadline_seconds: 300
    round_deadline_seconds: 1800
    allocation_walltime_seconds: 7200
    nodes_per_material_class: 16
    gpus_per_node: 4
    qos: gpu_premium

strategies:
  names: [LLM-guided adaptation]
  acquisition_rounds_per_seed: 3
  initial_checkpoints_frozen: true
  evidence_ledgers: append_only_per_material_stream
  shared_per_round: [candidate_universe, admissibility_rules, evaluation_budget,
                     endpoint, cost_accounting]
  leakage_controls:
    each_material_stream_reads_only_its_own_prior_round_evidence: true
  acquisition_comparison: none

llm_guided_configuration:
  provider: copilot
  model: gemini-4-carbon
  decoding: provider_default
  request_limits:
    max_calls_per_round: 1
    max_tokens: 8192
  environment_overrides: prohibited

outcomes:
  exploration:
    question: How extensively and efficiently was admissible crystallographic space explored?
    metrics:
      - generated_candidate_count
      - valid_candidate_count
      - unique_valid_structure_count
      - distinct_composition_and_canonical_structure_counts
      - chemical_and_structural_coverage
      - diversity_and_novelty_against_frozen_geometry_only_seed_set
      - mlip_evaluations_per_second
      - wall_time_device_hours_and_cost
    interpretation: descriptive_benchmark_results_not_a_discovery_claim
  learning:
    question: How did the LLM-guided acquisition decisions change across the three rounds?
    metrics:
      - selected_action_allocation_by_round
      - generated_and_duplicate_candidate_counts_by_round
      - convergence_counts_by_round
    interpretation: descriptive_only_no_rule_based_comparator

statistics:
  paired_unit: none
  comparison: none
  confidence_intervals: not_applicable_single_seed_single_strategy
  report_per_class_counts_and_measured_costs: true
  replicate_runs:
    independent_seeds_per_strategy_and_class: 1
    seed_values_recorded_in_campaign_manifest: true
    rounds_per_seed: 3
  aggregate_summary:
    include_equal_weight_class_macro_average: true
    include_pooled_counts_separately: true
    prevent_large_or_cheap_classes_from_dominating: true

provenance:
  content_address: [candidate_inputs, generator_config, model_checkpoints,
                    prompts, strategy_outputs, execution_records, metric_code]
  record_per_candidate: [round, selection_reason, cited_evidence_ids,
                         geometry_task_result]

manuscript:
  sections: [Exploration, Execution, Limitations]
  direct_strategy_comparison: false
  required_tables: [classwise_coverage_and_cost, roundwise_optimizer_outcomes]
  required_figures: [coverage_and_runtime_by_class, roundwise_task_outcomes]
  state_explicitly: [single_strategy, single_seed, no_independent_DFT_validation]
