cases:
  - case_id: cantor-ideal-static-force-criterion
    category: supported
    subject: Cantor FCC ideal MATS-0080
    claim: >-
      The VASP 6.6.1 converged static calculation on the exact archived ideal
      Cantor FCC coordinates reports a maximum atomic force at or below 0.02 eV/A.
    claim_type: property
    criterion: {quantity: max_force, unit: eV/A, target_structure: cantor-ideal-static-MATS0080, threshold: 0.02}
    expected_status: supported
    decisive_evidence: [static]
    dft_request_justified: false
    scope_sufficient: true
    scope_description: >-
      This claim is only about the force reported by the converged static electronic
      calculation on these exact coordinates. The preceding relaxation failed the
      per-ionic-step SCF qualification and is not being called a successful relaxation.
      No magnetic-ground-state or material-property inference is intended.
    evidence: {static: *ideal-static}

  - case_id: cantor-random1-static-force-criterion
    category: contradicted
    subject: Cantor FCC random1 MATS-0081
    claim: >-
      The VASP 6.6.1 converged static calculation on the exact archived random1
      Cantor FCC coordinates reports a maximum atomic force at or below 0.02 eV/A.
    claim_type: property
    criterion: {quantity: max_force, unit: eV/A, target_structure: cantor-random1-static-MATS0081, threshold: 0.02}
    expected_status: contradicted
    decisive_evidence: [static]
    dft_request_justified: false
    scope_sufficient: true
    scope_description: >-
      This claim is only about the force reported by the converged static electronic
      calculation on these exact coordinates. Its preceding relaxation did not pass
      the full SCF qualification. The static result converged from a zero-byte WAVECAR
      and a fresh electronic state; it is not evidence of mechanical equilibrium or
      the magnetic ground state.
    evidence: {static: *random1-static}

  - case_id: cantor-sampled-ranking-adequacy
    category: unresolved
    subject: Cantor FCC sampled configurations
    claim: >-
      The available calculations establish a physically reliable relaxed-configuration
      energy ranking among the four sampled Cantor FCC arrangements.
    claim_type: energy_ranking
    criterion: {quantity: energy_per_atom, unit: eV/atom, target_structure: cantor-ideal-static-MATS0080, comparison_structure: cantor-random1-static-MATS0081}
    expected_status: unresolved
    decisive_evidence: []
    dft_request_justified: true
    scope_sufficient: false
    scope_description: >-
      Only two converged static single points exist; both associated relaxations fail
      per-ionic-step SCF qualification, random1 static has 0.466 eV/A residual force,
      the static energy difference is only 0.192 meV/atom, one fresh static solution
      changes the total moment, and random2/random3 have no qualified static results.
      One 2x2x2 mesh and one initial magnetic configuration do not bound numerical
      or magnetic uncertainty. This is not a global stability claim.
    follow_up_tests:
      scope_gap: >-
        If ranking is retained, qualify ionic relaxations for the compared arrangements,
        then perform matched denser-k-mesh statics on the closest qualified pair and
        one alternative collinear magnetic initialization. Do not broaden beyond the
        four sampled configurations without a separate scientific design.
    evidence:
      ideal-static: *ideal-static
      ideal-relax: *ideal-relax
      random1-static: *random1-static
      random1-relax: *random1-relax
      random2-relax: *random2-relax
      random3-relax: *random3-relax
      ranking-evidence: *ranking-evidence
