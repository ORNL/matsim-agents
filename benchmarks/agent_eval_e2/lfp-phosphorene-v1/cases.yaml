        kpoints: Monkhorst-Pack 8x11x1
        ionic_accuracy_marker: "reached required accuracy"
    evidence_level: converged_dft
    outcome: measured
    values:
      - {name: total_energy, value: -19.77664371, unit: eV, structure: P-monolayer-ideal-UC (P4)}
      - {name: energy_per_atom, value: -4.94416093, unit: eV/atom, structure: P-monolayer-ideal-UC (P4)}
      - {name: final_max_force, value: 0.003948, unit: eV/A, structure: P-monolayer-ideal-UC (P4)}
      - {name: in_plane_area_per_atom, value: 3.626, unit: A^2, structure: P-monolayer-ideal-UC (P4)}
  phos-uc-geometry: &phos-uc-geometry
