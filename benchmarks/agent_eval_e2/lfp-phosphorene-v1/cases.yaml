# E2 fixed-evidence suite: LiFePO4 and phosphorene, from archived VASP records.
# Evidence values were extracted directly from the archived OUTCARs (private archive
# matsim-agents-dft-reference @ 4e186975593e23ad5427aac0657ad4d46ee4bf20); each record's
# method.settings carries the calculation path and OUTCAR SHA-256. Expected statuses were
# fixed before any assessor saw the packets; assessors receive only gold-free packets.
suite_id: e2-lfp-phosphorene-v1

x-methods:
  lfp: &lfp
    backend: vasp
    backend_version: 6.6.0
    method_signature: vasp6.6.0-pbe-noU-spin-encut520-ediff1e-6-ediffg0.01-isif3
    settings:
      functional: PBE (no Hubbard U)
      potcars: [PAW_PBE Li_sv 10Sep2004, PAW_PBE Fe_pv 02Aug2007, PAW_PBE P 06Sep2000, PAW_PBE O 08Apr2002]
      encut_eV: 520
      prec: Accurate
      ispin: 2
      magmom_initial: "Fe 5.0 muB (all parallel), others 0.6 muB"
      ismear: 0
      sigma_eV: 0.05
      ibrion: 2
      isif: 3
      ediffg_eV_per_A: -0.01
      archive_commit: 4e186975593e23ad5427aac0657ad4d46ee4bf20
  phos: &phos
    backend: vasp
    backend_version: 6.6.0
    method_signature: vasp6.6.0-pbe-nonspin-encut520-ediff1e-6-ediffg0.01-isif2
    settings:
      functional: PBE
      potcars: [PAW_PBE P 06Sep2000]
      encut_eV: 520
      prec: Accurate
      ismear: 0
      sigma_eV: 0.05
      ibrion: 2
      isif: 2
      ediffg_eV_per_A: -0.01
      vacuum_axis_cell_length_A: 20.0
      archive_commit: 4e186975593e23ad5427aac0657ad4d46ee4bf20

x-records:
  lfp-ideal: &lfp-ideal
    kind: relaxation
    subject: LiFePO4
    method:
      <<: *lfp
      settings:
        <<: *lfp
        calculation: dft_reference/vasp/calculations/critical_minerals_LiFePO4_olivine_ideal
        outcar_sha256: 062d690a73085a6b5965c1ffb1a64d1c05013950f720c415be4e7122d962d036
        kpoints: archived calculation KPOINTS
        ionic_accuracy_marker: "reached required accuracy"
    evidence_level: converged_dft
    outcome: measured
    values:
      - {name: total_energy, value: -195.77238993, unit: eV, structure: LiFePO4-olivine-ideal (Li4Fe4P4O16, 28 atoms)}
      - {name: final_max_force, value: 0.009575, unit: eV/A, structure: LiFePO4-olivine-ideal (Li4Fe4P4O16, 28 atoms)}
      - {name: final_max_abs_principal_stress, value: 1.22, unit: kbar, structure: LiFePO4-olivine-ideal (Li4Fe4P4O16, 28 atoms)}
      - {name: total_magnetization_abs, value: 16.0, unit: muB, structure: LiFePO4-olivine-ideal (Li4Fe4P4O16, 28 atoms)}
  lfp-antisite: &lfp-antisite
    kind: relaxation
    subject: LiFePO4
    method:
      <<: *lfp
      settings:
        <<: *lfp
        calculation: dft_reference/vasp/calculations/critical_minerals_LiFePO4_olivine_FeLi_antisite
        outcar_sha256: b3cb8f6974194571b7c1bf8244e9f7df0a8b4b830380cdc7969f135260bc9b81
        ionic_accuracy_marker: absent; run stopped after SCF convergence
    evidence_level: converged_dft
    outcome: not_converged
    failure_reason: ionic relaxation incomplete; final maximum force 81.4 eV/A and stress 237 kbar
    values:
      - {name: total_energy, value: -145.20514678, unit: eV, structure: LiFePO4-FeLi-antisite (Li4Fe4P4O16, 28 atoms)}
      - {name: final_max_force, value: 81.40, unit: eV/A, structure: LiFePO4-FeLi-antisite (Li4Fe4P4O16, 28 atoms)}
  phos-uc: &phos-uc
    kind: relaxation
    subject: phosphorene
    method:
      <<: *phos
      settings:
        <<: *phos
        calculation: dft_reference/vasp/calculations/2d_monolayer_P_ideal_UC
