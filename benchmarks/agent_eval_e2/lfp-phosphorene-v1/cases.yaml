cases:
  - case_id: lfp-ideal-force-criterion
    category: supported
    subject: LiFePO4
    claim: >-
      The archived ideal olivine LiFePO4 relaxation (PBE without U) ended with every atomic
      force at or below the 0.01 eV/A criterion it was run with.
    claim_type: structure
    criterion: {quantity: final_max_force, unit: eV/A, target_structure: LiFePO4-olivine-ideal (Li4Fe4P4O16, 28 atoms), threshold: 0.01}
    expected_status: supported
    decisive_evidence: [ideal]
    dft_request_justified: false
    follow_up_tests:
      nonconverged_calculation: rerun-relaxation-tighter-ediffg
    evidence:
      ideal: *lfp-ideal

  - case_id: lfp-ideal-afm-ground-state
    category: contradicted
    subject: LiFePO4
    claim: >-
      The archived ideal olivine LiFePO4 calculation represents the antiferromagnetic
      Fe ordering, i.e. its net cell moment is at or below 0.5 muB.
    claim_type: property
    criterion: {quantity: total_magnetization_abs, unit: muB, target_structure: LiFePO4-olivine-ideal (Li4Fe4P4O16, 28 atoms), threshold: 0.5}
    expected_status: contradicted
    decisive_evidence: [ideal]
    dft_request_justified: false
    follow_up_tests:
      missing_measurement: compare-afm-and-fm-spin-initializations
    evidence:
      ideal: *lfp-ideal

  - case_id: lfp-antisite-energy-ranking
    category: unresolved
    subject: LiFePO4
    claim: >-
      At fixed composition Li4Fe4P4O16, the ideal olivine is lower in total energy than the
      Fe/Li antisite configuration, by the archived PBE calculations.
    claim_type: energy_ranking
    criterion: {quantity: total_energy, unit: eV, target_structure: LiFePO4-olivine-ideal (Li4Fe4P4O16, 28 atoms), comparison_structure: LiFePO4-FeLi-antisite (Li4Fe4P4O16, 28 atoms)}
    expected_status: unresolved
    decisive_evidence: []
    dft_request_justified: true
    follow_up_tests:
      nonconverged_calculation: complete-antisite-ionic-relaxation
      missing_measurement: same-signature-relaxed-antisite-energy
    evidence:
      ideal: *lfp-ideal
      antisite: *lfp-antisite

  - case_id: lfp-on-convex-hull
    category: unresolved
    subject: LiFePO4
    claim: Olivine LiFePO4 lies on the Li-Fe-P-O convex hull in PBE at 0 K.
    claim_type: thermodynamic_stability
    criterion: {quantity: energy_above_hull, unit: eV/atom, target_structure: LiFePO4-olivine-ideal (Li4Fe4P4O16, 28 atoms), threshold: 0.0}
    expected_status: unresolved
    decisive_evidence: []
    dft_request_justified: true
    follow_up_tests:
      missing_measurement: compute-li-fe-p-o-competing-phase-references
      incomplete_references: compute-li-fe-p-o-competing-phase-references
    evidence:
      ideal: *lfp-ideal

  - case_id: phos-uc-force-criterion
    category: supported
    subject: phosphorene
    claim: >-
      The archived phosphorene unit-cell relaxation ended with every atomic force at or below
      the 0.01 eV/A criterion it was run with.
    claim_type: structure
    criterion: {quantity: final_max_force, unit: eV/A, target_structure: P-monolayer-ideal-UC (P4), threshold: 0.01}
    expected_status: supported
    decisive_evidence: [uc]
    dft_request_justified: false
    follow_up_tests:
      nonconverged_calculation: rerun-relaxation-tighter-ediffg
    evidence:
      uc: *phos-uc

  - case_id: phos-uc-threefold-puckered
    category: contradicted
    subject: phosphorene
    claim: >-
      The archived phosphorene unit cell is three-fold-coordinated puckered phosphorene: every
      P atom has its three nearest P neighbours within 2.5 A.
    claim_type: structure
    criterion: {quantity: third_nearest_neighbor_distance_max, unit: A, target_structure: P-monolayer-ideal-UC (P4), threshold: 2.5}
    expected_status: contradicted
    decisive_evidence: [geometry]
    dft_request_justified: false
    follow_up_tests:
      scope_gap: rebuild-and-relax-puckered-phosphorene-from-reference-structure
    evidence:
      uc: *phos-uc
      geometry: *phos-uc-geometry

  - case_id: phos-supercell-consistency
    category: contradicted
    subject: phosphorene
    claim: >-
      The archived ideal 3x3 supercell and ideal unit-cell records describe the same pristine
      sheet: their energies per atom differ by at most 0.01 eV/atom.
    claim_type: structure
    criterion: {quantity: energy_per_atom_difference_abs, unit: eV/atom, target_structure: P-monolayer-ideal-3x3 vs P-monolayer-ideal-UC, threshold: 0.01}
    expected_status: contradicted
    decisive_evidence: [comparison]
    dft_request_justified: false
    follow_up_tests:
      scope_gap: rebuild-and-relax-puckered-phosphorene-from-reference-structure
    evidence:
      uc: *phos-uc
      supercell: *phos-3x3
      comparison:
        kind: characterization
        subject: phosphorene
        method:
          backend: arithmetic
          method_signature: energy-per-atom-difference-same-vasp-signature
          settings:
            formula: "|E(P36)/36 - E(P4)/4|"
            inputs_outcar_sha256: [5a6ed305d86db7ecfbb1f56112f7287c2678bd69012aca747c6d5bd03af88ba4, bc3c32cbcdcb77253d6c1f5a4f7cfccb27767057a17b661ab7d9e8380ebe92d2]
        evidence_level: converged_dft
        outcome: measured
        values:
          - {name: energy_per_atom_difference_abs, value: 1.0175, unit: eV/atom, structure: P-monolayer-ideal-3x3 vs P-monolayer-ideal-UC}

  - case_id: phos-vacancy-formation-below-2eV
    category: unresolved
    subject: phosphorene
    claim: >-
      The neutral single-vacancy formation energy in this phosphorene sheet is below 2 eV, by
      the archived PBE calculations.
    claim_type: property
    criterion: {quantity: vacancy_formation_energy, unit: eV, target_structure: P-monolayer-vacancy-3x3 (P35), threshold: 2.0}
    expected_status: unresolved
    decisive_evidence: []
    dft_request_justified: true
    follow_up_tests:
      missing_measurement: relax-valid-pristine-and-vacancy-cells-same-signature
      scope_gap: rebuild-and-relax-puckered-phosphorene-from-reference-structure
    evidence:
      uc: *phos-uc
      geometry: *phos-uc-geometry
      supercell: *phos-3x3
      vacancy: *phos-vacancy
