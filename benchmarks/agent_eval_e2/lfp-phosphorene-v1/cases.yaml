      - {name: energy_per_atom, value: -3.92666359, unit: eV/atom, structure: P-monolayer-ideal-3x3 (P36)}
      - {name: final_max_force, value: 0.000427, unit: eV/A, structure: P-monolayer-ideal-3x3 (P36)}
