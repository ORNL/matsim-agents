      - {name: nearest_neighbor_distance_2nd, value: 2.745, unit: A, structure: P-monolayer-ideal-UC (P4)}
      - {name: third_nearest_neighbor_distance_max, value: 2.745, unit: A, structure: P-monolayer-ideal-UC (P4)}
      - {name: neighbors_within_2p5A_per_atom, value: 1, unit: count, structure: P-monolayer-ideal-UC (P4)}
      - {name: ionic_steps_taken, value: 1, unit: count, structure: P-monolayer-ideal-UC (P4)}
  phos-3x3: &phos-3x3
    kind: relaxation
    subject: phosphorene
    method:
      <<: *phos
      settings:
        <<: *phos
        calculation: dft_reference/vasp/calculations/2d_monolayer_P_ideal_3x3
        outcar_sha256: 5a6ed305d86db7ecfbb1f56112f7287c2678bd69012aca747c6d5bd03af88ba4
        kpoints: Monkhorst-Pack 3x4x1
        ionic_accuracy_marker: "reached required accuracy"
    evidence_level: converged_dft
