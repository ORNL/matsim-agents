    category: supported
    subject: NbTaO5 ordering-01
    claim: Using the qualified fixed-protocol static energies for NbTaO5 ordering-01, bcc Nb, bcc Ta, and triplet O2, the uncorrected PBE formation energy of NbTaO5 is negative relative to the elements.
