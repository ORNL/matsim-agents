# E2 fixed-evidence suite: NbTaVHfZrTi BCC, from Aurora VASP 6.6.1 outputs.
# The four 128-atom configurations share a near-equiatomic composition and one
# nonmagnetic 2x2x2 Gamma protocol. "Ideal" is an archive label, not an ordered reference.
suite_id: e2-nbtavhfrz-bcc-v1

x-method: &bcc-method
  backend: vasp
  backend_version: 6.6.1
  method_signature: vasp6.6.1-pbe-nonspin-encut345-smear0.10-gamma2x2x2-bcc-v1
  settings:
    functional: PBE
    paw: [Hf_pv, Nb_pv, Ta_pv, Ti_pv, V_pv, Zr_sv]
    encut_eV: 345
    prec: Accurate
    ediff_eV: 1.0e-6
    ispin: 1
    ismear: 1
    sigma_eV: 0.10
    kpoints: Gamma 2x2x2
    relax: {ibrion: 2, isif: 3, nsw: 200, ediffg_eV_A: -0.02}
    static: {nsw: 0, same_geometry_as_relax: true}
    source_run: ../e2-dft-v1-20261104
    qualification_protocol: VASP normal termination, SCF convergence, and final max force <= 0.02 eV/A

x-records:
  bcc-ideal-relax: &bcc-ideal-relax
    kind: relaxation
    subject: NbTaVHfZrTi BCC, exact archived configuration bcc_hea_NbTaVHfZrTi_equiatomic_128_ideal
    method:
      <<: *bcc-method
      settings:
        <<: *bcc-method
        source_case: ../e2-dft-v1-20261104/cases/bcc_hea_NbTaVHfZrTi_equiatomic_128_ideal
        source_structure_sha256: 798e572ee9dd7c5a6a40a0a1c80989a0e1c259548f22d503a69ca1a1440044d7
        qualification_record: verify-relax.json
        outcar_sha256: 9d938c65ee502b696a529d0002d12ce023fbe45c25e7892bcb48b8b23b688c59
        composition: Hf21Nb22Ta22Ti21V21Zr21 (128 atoms)
        ionic_accuracy_marker: "reached required accuracy"
        max_force_eV_A: 0.019855073230789153
        final_energy_sigma0_eV: -1205.86131762
    evidence_level: converged_dft
    outcome: measured
    values:
      - {name: final_max_force, value: 0.019855073230789153, unit: eV/A, structure: bcc-archive-ideal-Hf21Nb22Ta22Ti21V21Zr21}

  bcc-sampled-energies: &bcc-sampled-energies
    kind: energy_ranking
    subject: Four sampled NbTaVHfZrTi BCC configurations
    method: *bcc-method
    evidence_level: converged_dft
    outcome: measured
    values:
      - {name: energy_per_atom, value: -9.42095949359375, unit: eV/atom, structure: bcc-archive-ideal-Hf21Nb22Ta22Ti21V21Zr21}
      - {name: energy_per_atom, value: -9.433103870078124, unit: eV/atom, structure: bcc-random1-Hf21Nb22Ta22Ti21V21Zr21}
      - {name: energy_per_atom, value: -9.42343321125, unit: eV/atom, structure: bcc-random2-Hf21Nb22Ta22Ti21V21Zr21}
      - {name: energy_per_atom, value: -9.426475914375, unit: eV/atom, structure: bcc-random3-Hf21Nb22Ta22Ti21V21Zr21}
    reference_complete: false
    failure_reason: >-
      No k-point or magnetic-state sensitivity tests quantify uncertainty in the
      sampled energy differences; the values support only the named fixed protocol.

cases:
  - case_id: bcc-ideal-force-criterion
    category: supported
    subject: NbTaVHfZrTi BCC
    claim: >-
      The specified 128-atom archived BCC configuration
      bcc_hea_NbTaVHfZrTi_equiatomic_128_ideal ended its recorded nonmagnetic
      PBE relaxation with every atomic force at or below its 0.02 eV/A criterion.
    claim_type: structure
    criterion: {quantity: final_max_force, unit: eV/A, target_structure: bcc-archive-ideal-Hf21Nb22Ta22Ti21V21Zr21, threshold: 0.02}
    expected_status: supported
    decisive_evidence: [ideal-relax]
    dft_request_justified: false
    scope_sufficient: true
    scope_description: >-
      This is a statement about one exact recorded relaxation and its own threshold.
      It does not validate the nonmagnetic approximation or infer an alloy property.
    follow_up_tests:
      nonconverged_calculation: none-required-for-recorded-force-criterion
    evidence:
      ideal-relax: *bcc-ideal-relax

  - case_id: bcc-sampled-ranking-adequacy
    category: unresolved
    subject: NbTaVHfZrTi BCC
    claim: >-
      The available calculations establish a physically reliable energy ranking
      among the four named sampled BCC configurations, accounting for numerical
      and magnetic-state uncertainty.
    claim_type: energy_ranking
    criterion: {quantity: energy_per_atom, unit: eV/atom, target_structure: bcc-random1-Hf21Nb22Ta22Ti21V21Zr21, comparison_structure: bcc-archive-ideal-Hf21Nb22Ta22Ti21V21Zr21}
    expected_status: unresolved
    decisive_evidence: []
    dft_request_justified: true
    scope_sufficient: false
    scope_description: >-
      Four same-protocol energies exist, but only for one nonmagnetic 2x2x2 Gamma
      mesh. The nearest pair differs by about 3.04 meV/atom; k-point and magnetic
      sensitivity are unmeasured. The archive label "ideal" is another random-like
      arrangement, not an ordered reference. No global stability inference is allowed.
    follow_up_tests:
      scope_gap: >-
        If this ranking claim is retained, run matched 3x3x3 Gamma statics on the
        closest competing configurations and a targeted ISPIN=2 static sensitivity
        check; do not expand to a broad convergence campaign without review.
    evidence:
      sampled-energies: *bcc-sampled-energies