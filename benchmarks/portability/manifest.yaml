{
  "schema_version": 1,
  "benchmark_id": "silicon-portability-v1",
  "description": "Fixed Si contract and real-compute qualification for Frontier, Aurora, and Perlmutter.",
  "structures": ["structures/Si.vasp"],
  "coverage": {
    "contract": {
      "purpose": "Deterministic orchestration, persistence, governance, resume, and allocation checks; not numerical backend evidence.",
      "suites": ["smoke", "relaxation-adapter", "active-learning-mini-loop", "dft-allocation", "phase-exploration", "llm-discussion"]
    },
    "compute": {
      "purpose": "Production numerical qualification using installed models and QE assets.",
      "required": ["real-mlip-relaxation", "real-qe-relaxation", "scientific-summary"]
    },
    "all_model_scientific_debate": {
      "purpose": "Every first-class catalog LLM debates one materials-design hypothesis with every peer.",
      "minimum_rounds": 2,
      "model_set": "deployments/common/open-model-catalog.json",
      "required_artifacts": ["all_model_scientific_debate_result.json", "dialogue.json"]
    }
  },
  "suites": {
    "smoke": ["environment", "launcher"],
    "relaxation": ["mlip", "qe", "vasp", "mlip-qe", "mlip-vasp"],
    "active-learning": {"candidate_count": 4, "selected_count": 2, "retrain": false},
    "phase-exploration": {"compositions": ["Si"], "random_candidates": 4},
    "llm-discussion": {
      "turns": ["proposal", "critique", "revision"],
      "phase_dispatch": true,
      "deterministic_by_default": true
    }
  },
  "acceptance": {
    "required_artifacts": ["result.json", "environment.json", "scientific_summary.json"],
    "convergence": {"require_finite_energy": true, "max_force_eV_per_A": 0.20},
    "cross_facility": {
      "energy_eV_per_atom_atol": 0.05,
      "max_force_eV_per_A_atol": 0.05,
      "position_A_rmsd_atol": 0.05
    },
    "invariants": [
      "same_structure_count",
      "same_selected_candidate_ids",
      "no_model_retraining",
      "disjoint_dft_node_groups"
    ]
  }
}
