# Compute-qualification case: pure QE relaxation of the benchmark Si cell.
# structure_path and output_root are overridden by qualification.py at run time.
mode: dft

geometry:
  relax_atoms: true
  relax_cell: true
  fixed_atom_indices: []
  charge: 0.0
  spin: 0.0
  preserve_symmetry: false

dft:
  backend: qe
  launcher: /global/cfs/projectdirs/m5216/mlupopa/matsim-agents/external/quantum-espresso/install-gpu/bin/pw.x
  pseudo_dir: /global/cfs/projectdirs/m5216/mlupopa/matsim-agents/external/quantum-espresso/src/pseudo
  timeout_sec: 7200
  settings:
    pseudopotentials:
      Si: Si_r.upf
    kpts: [4, 4, 4]
    koffset: [0, 0, 0]
    occupations: smearing
    smearing: gaussian
    degauss_ry: 0.007

dft_approved: true
approvals:
  before_dft: true
  before_retraining: true
  before_model_promotion: true

max_steps: 200
force_tolerance_eV_per_A: 0.02
