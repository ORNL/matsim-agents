# Real active-learning-loop case for the benchmark Si cell: UMA MD sampling ->
# random acquisition -> QE single-point DFT labelling. One iteration, sized
# for a fast portability qualification (not full scientific accuracy).
#
# loop.out_dir is supplied via the MATSIM_AL_OUT_DIR environment variable so
# active_learning_scientific_debate.py owns the output location, matching the
# structure_path/output_root override convention in qualification.py.

mlip:
  backend: uma
  uma:
    model_name: uma-s-1p1
    task_name: omat
    device: cuda

md:
  seed_source:
    kind: paths
    paths:
      - /global/cfs/projectdirs/m5216/mlupopa/matsim-agents/benchmarks/portability/structures/Si.vasp
  timestep_fs: 1.0
  n_steps: 40
  temperature_K: 300.0
  thermostat: langevin
  friction_inv_ps: 0.2
  sample_every: 10
  max_force_threshold_eV_per_A: 40.0
  max_displacement_A: 3.0

acquisition:
  strategy: random
  n_select: 2
  diversity_filter: true
  min_uncertainty_eV_per_A: 0.0

dft:
  backend: qe
  qe:
    pw_bin: /global/cfs/projectdirs/m5216/mlupopa/matsim-agents/external/quantum-espresso/install-gpu/bin/pw.x
    pw_wrapper: /global/cfs/projectdirs/m5216/mlupopa/matsim-agents/deployments/perlmutter/launchers/_qe-step-perlmutter.sh
    pseudo_dir: /global/cfs/projectdirs/m5216/mlupopa/matsim-agents/external/quantum-espresso/src/pseudo
    pseudopotentials:
      Si: Si_r.upf
    kpts: [4, 4, 4]
    koffset: [0, 0, 0]
    occupations: smearing
    smearing: gaussian
    degauss_ry: 0.007
    nodes_per_job: 1
    ranks_per_node: 4
    threads_per_rank: 16
    timeout_sec: 3600

trainer:
  enabled: false

loop:
  n_iterations: 1
  out_dir: ${MATSIM_AL_OUT_DIR}
  dataset_format: extxyz
  resume: true
  fail_fast: true
